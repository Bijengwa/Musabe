# Musabe Schools Management System — PostgreSQL + backend/web.
#
#   cp .env.example .env      # then edit secrets
#   docker compose up --build -d
#   docker compose run --rm backend python -m scripts.seed   # optional demo data
#
# Data lives in the named volume `pgdata` and survives restarts/recreates.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musabe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musabe}
      POSTGRES_DB: ${POSTGRES_DB:-musabe}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musabe} -d ${POSTGRES_DB:-musabe}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Musabe Schools Management System}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      POSTGRES_USER: ${POSTGRES_USER:-musabe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musabe}
      POSTGRES_DB: ${POSTGRES_DB:-musabe}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"

volumes:
  pgdata:
