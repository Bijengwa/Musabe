<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Musabe Schools System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: app shell — deep green role-based sidebar on the left, scoped top bar, working area of panels. */
:root{
  --bg:#f4f8f5;--surface:#ffffff;--soft:#ebf3ee;--ink:#13241b;--muted:#587064;--line:#d8e5dc;
  --primary:#16794a;--primary-ink:#ffffff;--primary-soft:#dff2e7;
  --side:#0c3a29;--side-ink:#bfe0cf;--side-hi:#ffffff;--side-act:#16794a;
  --ok:#1d8a4e;--ok-soft:#ddf3e6;--warn:#b86e00;--warn-soft:#fff1d9;--bad:#c23a2b;--bad-soft:#fde5e1;
  --pre:#d9822b;--boys:#1f5fbf;--girls:#c2347a;
  --bA:#1d8a4e;--bB:#6aa84f;--bC:#e0a82e;--bD:#e07b39;--bF:#c23a2b;
  --shadow:0 1px 2px rgba(12,58,41,.06),0 4px 16px rgba(12,58,41,.05);
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'Space Grotesk','Inter',system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1612;--surface:#14211b;--soft:#1a2b23;--ink:#e3efe8;--muted:#93ab9e;--line:#26392f;
  --primary:#3fb37a;--primary-ink:#06130d;--primary-soft:#173a29;
  --side:#08120d;--side-ink:#9cc4b0;--side-hi:#ffffff;--side-act:#1d6b46;
  --ok:#4cc085;--ok-soft:#173a29;--warn:#e7a542;--warn-soft:#3a2c12;--bad:#ef7a6b;--bad-soft:#3d1c18;
  --pre:#f0a052;--boys:#6c9ff0;--girls:#ec74b1;
  --bA:#4cc085;--bB:#8cc46f;--bC:#e9bb4f;--bD:#ee955a;--bF:#ef7a6b;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1612;--surface:#14211b;--soft:#1a2b23;--ink:#e3efe8;--muted:#93ab9e;--line:#26392f;
  --primary:#3fb37a;--primary-ink:#06130d;--primary-soft:#173a29;
  --side:#08120d;--side-ink:#9cc4b0;--side-hi:#ffffff;--side-act:#1d6b46;
  --ok:#4cc085;--ok-soft:#173a29;--warn:#e7a542;--warn-soft:#3a2c12;--bad:#ef7a6b;--bad-soft:#3d1c18;
  --pre:#f0a052;--boys:#6c9ff0;--girls:#ec74b1;
  --bA:#4cc085;--bB:#8cc46f;--bC:#e9bb4f;--bD:#ee955a;--bF:#ef7a6b;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.login .brandside{background:var(--side);color:var(--side-ink);padding-block:48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:32px;display:flex;flex-direction:column;gap:28px}
.crest{width:56px;height:56px;border-radius:14px;background:var(--primary);display:grid;place-items:center;color:#fff;font-family:var(--f-head);font-weight:700;font-size:26px}
.login h1{color:var(--side-hi);font-size:30px}
.login .brandside p{margin:0;max-width:40ch}
.schl{display:flex;flex-direction:column;gap:10px}
.schl div{display:flex;align-items:center;gap:10px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.d-pre{background:var(--pre)}.d-boys{background:var(--boys)}.d-girls{background:var(--girls)}
.pickside{padding-block:40px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px));overflow:auto}
.pickside h2{font-size:20px}
.pickside .hint{color:var(--muted);margin:6px 0 22px}
.accgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.accgroup{margin-bottom:24px}
.accgroup h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;font-family:var(--f-body)}
.acc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.acc:hover{border-color:var(--primary)}
.acc b{font-weight:600}
.acc span{color:var(--muted);font-size:12.5px}
@media (max-width:820px){.login{grid-template-columns:1fr}.login .brandside{padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.pickside{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px}
.brand .crest{width:38px;height:38px;font-size:18px;border-radius:10px}
.brand b{color:var(--side-hi);font-family:var(--f-head);display:block;font-size:15px}
.brand span{font-size:12px}
.who{margin:4px 12px 10px;padding:10px 12px;border-radius:var(--r);background:rgba(255,255,255,.06)}
.who b{color:var(--side-hi);display:block;font-weight:600;font-size:13px}
.who span{font-size:12px}
.navg{padding:6px 10px}
.navg h4{margin:8px 8px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;opacity:.7}
.nav{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;color:var(--side-ink);padding:8px 10px;border-radius:8px;text-align:left;font-size:13.5px}
.nav:hover{background:rgba(255,255,255,.07);color:var(--side-hi)}
.nav.on{background:var(--side-act);color:#fff;font-weight:600}
.nav .ic{width:18px;height:18px;flex:none}
.nav .vo{margin-left:auto;font-size:10.5px;opacity:.75;border:1px solid currentColor;border-radius:999px;padding:0 6px}
.nav .cnt{margin-left:auto;background:var(--warn);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:0 7px}
.sidefoot{margin-top:auto;padding:12px}
.sidefoot button{width:100%;background:none;border:1px solid rgba(255,255,255,.18);color:var(--side-ink);border-radius:8px;padding:8px;display:flex;gap:8px;align-items:center;justify-content:center}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top .menu{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px}
.top .crumb{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sp-fixed{margin-left:auto}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.content{padding-block:22px 48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1280px;width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.scrim{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:30;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
  .top .menu{display:inline-flex}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* ---------- blocks ---------- */
.ph1{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph1 .t{min-width:0;flex:1 1 320px}
.ph1 h1{font-size:24px}
.ph1 p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.ph1 .acts{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>.hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>.hd h2{font-size:15px}
.panel>.hd .sub{color:var(--muted);font-size:12.5px}
.panel>.hd .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel>.bd{padding:14px 16px;min-width:0}
.panel>.bd.flush{padding:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g-wide{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:1050px){.grid3{grid-template-columns:1fr 1fr}.g-wide{grid-template-columns:1fr}}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--f-head);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.hi{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.kpi.hi .l,.kpi.hi .s{color:inherit;opacity:.85}
.kpi.warn{border-color:var(--warn);background:var(--warn-soft)}
.kpi.bad{border-color:var(--bad);background:var(--bad-soft)}
.up{color:var(--ok);font-weight:600}.down{color:var(--bad);font-weight:600}.flat{color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--primary-soft);color:var(--primary)}
.sp{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.sp-pre{background:var(--pre)}.sp-boys{background:var(--boys)}.sp-girls{background:var(--girls)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--primary)}
.btn.p{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .ic{width:15px;height:15px}
.cta{display:flex;align-items:center;gap:16px;background:var(--primary);color:var(--primary-ink);border:0;border-radius:var(--r);padding:20px 22px;text-align:left;width:100%}
.cta b{font-family:var(--f-head);font-size:20px;display:block}
.cta .ic{width:34px;height:34px;flex:none}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;color:var(--ink);min-width:0;width:100%}
textarea{min-height:90px;resize:vertical}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notice{border-radius:var(--r);padding:11px 14px;background:var(--primary-soft);color:var(--ink);display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.notice.warn{background:var(--warn-soft)}
.notice.bad{background:var(--bad-soft)}
.notice .ic{width:18px;height:18px;flex:none;margin-top:1px}
.notice .grow{flex:1 1 240px;min-width:0}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.li .grow span{color:var(--muted);font-size:12.5px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar .fl{height:100%;border-radius:999px;background:var(--primary)}
.bar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stackbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--soft)}
.stackbar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:13px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.matrix td{text-align:center}
.cell{display:inline-flex;min-width:68px;justify-content:center;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px}
.cell.ok{background:var(--ok-soft);color:var(--ok)}
.cell.bad{background:var(--bad-soft);color:var(--bad)}
.heat td.h{text-align:center;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.mk{width:58px;padding:5px 6px;text-align:right}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);flex-direction:row;font-weight:400}
.chk input{width:auto}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.qtxt{max-width:60ch}
.scope-note{font-size:12.5px;color:var(--muted)}

/* modal */
.mwrap{position:fixed;inset:0;z-index:50;background:rgba(5,20,13,.45);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{width:min(820px,100%)}
.modal .mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.modal .mh h2{font-size:17px}
.modal .mh button{margin-left:auto;background:none;border:0;padding:4px}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* receipt book */
.rcpt{border:1.5px dashed var(--line);border-radius:10px;padding:18px;background:var(--surface);font-size:13.5px}
.rcpt .rh{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:10px}
.rcpt .rh .crest{width:42px;height:42px;font-size:20px}
.rcpt .rh b{font-family:var(--f-head);font-size:16px;display:block}
.rcpt .rno{margin-left:auto;text-align:right}
.rcpt .rno b{color:var(--bad);font-size:18px;font-variant-numeric:tabular-nums}
.rcpt .line{display:flex;gap:8px;padding:6px 0;border-bottom:1px dotted var(--line)}
.rcpt .line span{color:var(--muted);min-width:110px}
.rcpt .words{font-style:italic}
.rcpt .sig{display:flex;justify-content:space-between;margin-top:18px;gap:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:500;max-width:calc(100% - 32px)}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--primary);font-weight:600}
.reason{display:inline-block;font-size:12px;background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:1px 7px;margin:1px 4px 1px 0}
.reason.w{background:var(--warn-soft);color:var(--warn)}
</style>

<div id="app"></div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n||0).toLocaleString('en-US');
const tzs=n=>'TZS '+fmt(n);
const pct=n=>n==null?'–':Math.round(n)+'%';
const avg=a=>{a=a.filter(x=>x!=null&&!isNaN(x));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
const sum=a=>a.reduce((s,x)=>s+(x||0),0);
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const pick=a=>a[Math.floor(rnd()*a.length)];
const gauss=()=>{let u=0;for(let i=0;i<6;i++)u+=rnd();return (u-3)*1.41};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const TODAY='2026-11-10';
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const fdate=d=>new Date(d.slice(0,10)+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
const fday=d=>d.slice(0,10)===TODAY?'Today':d.slice(0,10)===addDays(TODAY,-1)?'Yesterday':new Date(d.slice(0,10)+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});

 const a=stuSeries(sid,subjs);const li=lastIdx(a);const out={flag:false,reasons:[],last:null,change:null};
 if(li<0)return out;const cfg=S?.cfg||{low:40,drop:10};
 out.last=a[li];const prev=avg(a.slice(Math.max(0,li-2),li));out.change=prev==null?null:a[li]-prev;
 if(a[li]<cfg.low)out.reasons.push(['Below '+cfg.low+'% in '+SETS[li].name,'b']);
 if(out.change!=null&&out.change<=-cfg.drop)out.reasons.push(['Dropped '+Math.abs(Math.round(out.change))+' pts','b']);
 const s=stu(sid);const ss=subjs||CL[s.cls].subjs;
 if(ss.some(sj=>{const p=P(li+1,s.cls,sj);return p&&p.entered&&p.marks[sid]==='AB'}))out.reasons.push(['Absent for a paper','w']);
 out.flag=out.reasons.some(r=>r[1]==='b');return out})}

function lineChart(labels,series,{h=220,min=0,max=100,suf='%'}={}){
 const W=640,L=36,Rr=14,T=12,B=26,iw=W-L-Rr,ih=h-T-B;
 const x=i=>L+(labels.length<2?iw/2:i*iw/(labels.length-1));const y=v=>T+ih-(v-min)/(max-min)*ih;
 let g='';for(let v=min;v<=max;v+=(max-min)/4){g+=`<line class="gl" x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}${suf}</text>`}
 labels.forEach((l,i)=>g+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${esc(l)}</text>`);
 series.forEach(s=>{let d='',pts='';s.values.forEach((v,i)=>{if(v==null)return;d+=(d?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);pts+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===lastIdx(s.values)?4.5:2.6}" fill="${s.color}"><title>${esc(s.name)} · ${esc(labels[i])}: ${Math.round(v)}${suf}</title></circle>`});
  g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${pts}`});
 return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`+(series.length>1?`<div class="legend" style="margin-top:6px">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'');
}

/* ================= receipts modal ================= */
const ONES=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function words(n){n=Math.round(n);if(n===0)return 'zero';const w=x=>x<20?ONES[x]:x<100?TENS[Math.floor(x/10)]+(x%10?'-'+ONES[x%10]:''):ONES[Math.floor(x/100)]+' hundred'+(x%100?' and '+w(x%100):'');let s='';if(n>=1e6){s+=w(Math.floor(n/1e6))+' million ';n%=1e6}if(n>=1000){s+=w(Math.floor(n/1000))+' thousand ';n%=1000}if(n)s+=w(n);return s.trim()}
function showReceipt(id){const r=S.receipts.find(x=>x.id===id);const s=stu(r.stu);const sc=sch(r.school);
 modal('Receipt '+rno(r),`<div class="rcpt"><div class="rh"><div class="crest">M</div><div><b>${esc(sc.name.toUpperCase())}</b><span class="small muted">P.O. Box, Buhongwa · Mwanza · info@musabeschools.ac.tz</span></div><div class="rno"><span class="small muted">RECEIPT No.</span><br><b>${rno(r)}</b></div></div>
 <div class="line"><span>Date</span><b>${fdate(r.at)} · ${r.at.slice(11)}</b></div><div class="line"><span>Received from</span><b>${esc(s.name)} (${esc(s.reg)}) · ${esc(CL[s.cls].name)}</b></div>
 <div class="tw" style="margin:8px 0"><table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Amount</th></tr></thead><tbody>${r.lines.map(l=>`<tr><td>${esc(iname(l.item))}</td><td class="n">${l.qty}</td><td class="n">${fmt(l.price)}</td><td class="n">${fmt(l.qty*l.price)}</td></tr>`).join('')}<tr><td colspan="3"><b>TOTAL</b></td><td class="n"><b>${fmt(r.total)}</b></td></tr></tbody></table></div>
 <div class="line"><span>Amount in words</span><span class="words">${esc(words(r.total))} shillings only</span></div><div class="line"><span>Paid by</span><b>${esc(r.pay)}${r.ref?' · '+esc(r.ref):''}</b></div>
 <div class="sig"><div><span class="small muted">Bursar</span><br><b>${esc(sname(r.by))}</b></div><div style="text-align:right"><span class="small muted">Library</span><br>${r.given?`<b>Given by ${esc(sname(r.givenBy))}</b><br><span class="small muted">${fdate(r.givenAt)} ${r.givenAt.slice(11)}</span>`:'<span class="pill warn">Not yet collected</span>'}</div></div></div>
 <p class="small muted" style="margin:0">In the installed system this prints on the school's receipt layout. Receipts cannot be cancelled.</p>`,R()==='librarian'&&!r.given&&r.school===U().school&&canGive(r)?btn('Mark items given','give',`data-id="${r.id}"`,'p'):btn('Close','mclose'),true)}

 if(!rows.length){document.getElementById('i-err').textContent='Nothing to load. Paste at least one row.';return}

 const lines=c.lines.map(l=>{const it=item(l.item);return {item:l.item,qty:l.qty,price:st.gender==='F'?it.pf:it.pm}});
 const r={id:uid(),no:S.nextRec[s]++,school:s,stu:st.id,lines,total:sum(lines.map(l=>l.qty*l.price)),pay:c.pay,ref:c.pay==='Cash'?'':c.ref,by:V.user,at:TODAY+' '+nowT(),given:false,givenAt:null,givenBy:null};

 modal('Add a question',`<label>Level and subject<select id="q-ls" data-chg="qls">${uniq.map(([l,s])=>`<option value="${l}|${s}">${LV[l].name} · ${SUBJ[s]}</option>`).join('')}</select></label><label>Topic<select id="q-t">${LV[uniq[0][0]].subj[uniq[0][1]].map(t=>`<option>${esc(t)}</option>`).join('')}</select></label><label>Question<textarea id="q-x"></textarea></label><div class="fg"><label>Marks<input id="q-m" type="number" value="4"></label><label>Source<select id="q-s"><option>Teacher</option><option>NECTA past paper</option></select></label></div>`,btn('Cancel','mclose')+btn('Add to bank','q-save','','p'))};
ACT['q-save']=()=>{const [lv,subj]=val('q-ls').split('|');if(!val('q-x'))return toast('Type the question');S.bank.unshift({id:uid(),lv,subj,topic:val('q-t'),text:val('q-x'),max:+val('q-m')||1,src:val('q-s'),used:0,by:V.user});log(`Added a ${SUBJ[subj]} question to the bank`,U().school);save();closeModal();render();toast('Question added')};
ACT['plan-new']=e=>{const s=stu(e.dataset.id);modal('Support plan for '+esc(s.name),`<label>Goal<input id="p-g" placeholder="e.g. Bring Mathematics above 50% by the next set"></label><label>What we will do<textarea id="p-a" placeholder="Extra lessons, parent meeting, peer study..."></textarea></label><label>Check again on<input id="p-r" type="date" value="${addDays(TODAY,14)}"></label>`,btn('Cancel','mclose')+btn('Start plan','plan-save',`data-id="${s.id}"`,'p'))};
ACT['plan-save']=e=>{if(!val('p-g'))return toast('Write the goal');S.plans.unshift({id:uid(),stu:e.dataset.id,by:V.user,at:TODAY,status:'Open',goal:val('p-g'),actions:val('p-a'),review:val('p-r')||addDays(TODAY,14)});log(`Started a support plan for ${stu(e.dataset.id).name}`,stu(e.dataset.id).school);save();closeModal();render();toast('Plan started')};
ACT['plan-st']=e=>{const p=S.plans.find(x=>x.id===e.dataset.id);p.status=e.dataset.v;save();render()};
ACT['cfg-save']=()=>{S.cfg.low=+val('cfg-low')||40;S.cfg.drop=+val('cfg-drop')||10;S.cfg.cur=+val('cfg-cur')||8;log('Changed warning rules and current set',null);save();render();toast('Rules saved')};
ACT['school-new']=()=>modal('Add school',`<div class="fg"><label>School name<input id="sc-n"></label><label>Levels<input id="sc-l" placeholder="e.g. Form V–VI"></label><label>Receipt prefix<input id="sc-p" maxlength="3" placeholder="e.g. HS"></label></div><p class="small muted" style="margin:0">After adding, create its School Admin in Staff accounts.</p>`,btn('Cancel','mclose')+btn('Add school','school-save','','p'));
ACT['school-save']=()=>{const n=val('sc-n'),p=val('sc-p').toUpperCase();if(!n||!p)return toast('Type a name and a prefix');const id='s'+S._id++;S.schools.push({id,name:n,short:n.replace('Musabe ','').replace(' School',''),pre:p,levels:val('sc-l')||'—'});S.stock[id]={};S.items.forEach(i=>S.stock[id][i.id]=0);S.nextRec[id]=1;
 const st=document.createElement('style');st.textContent=`.sp-${id}{background:var(--muted)}`;document.head.appendChild(st);SC_COL[id]='--muted';log('Added school '+n,null);save();closeModal();render();toast('School added')};
ACT['copy-rep']=e=>{const [,,cols,rows]=V.reports[+e.dataset.i];const txt=[cols,...rows].map(r=>r.join('\t')).join('\n');
 const done=()=>toast('Copied. Paste into Excel.');try{navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt))}catch(x){fallbackCopy(txt)}};
function fallbackCopy(t){modal('Copy this table',`<textarea id="cp" style="min-height:200px">${esc(t)}</textarea><p class="small muted" style="margin:0">Select all and copy, then paste into Excel.</p>`,btn('Done','mclose','','p'));setTimeout(()=>{const a=document.getElementById('cp');a.focus();a.select()},50)}

document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){f(el,ev)}});
document.addEventListener('change',ev=>{const el=ev.target;const k=el.dataset.chg;if(!k)return;
 if(k==='pay'){V.f.cart.pay=el.value;render();return}
 if(k==='delLib'){V.f.del.lib=el.value;document.querySelectorAll('[data-dq]').forEach(i=>V.f.del.lines[i.dataset.dq]=+i.value||0);render();return}
 if(k==='newRole'){const sel=document.getElementById('n-sch');if(sel&&ADMIN_ROLES.includes(el.value))sel.value='';return}
 if(k==='qls'){const [l,s]=el.value.split('|');document.getElementById('q-t').innerHTML=LV[l].subj[s].map(t=>`<option>${esc(t)}</option>`).join('');return}
 V.f[k]=el.value;render()});
document.addEventListener('input',ev=>{const el=ev.target;const k=el.dataset.inp;if(!k)return;
 if(k==='ref'){V.f.cart.ref=el.value;const b=document.querySelector('[data-act="sell-save"]');if(b)b.disabled=!V.f.cart.stu||!V.f.cart.lines.length||!el.value.trim();return}
 V.f[k]=el.value;const pos=el.selectionStart;render();const n=document.getElementById(el.id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});

/* ================= boot ================= */
if(!load()||!S.staff||!S.papers)fresh();
try{const u=localStorage.getItem(KEY+'-u');if(u&&S.staff.some(x=>x.id===u))V.user=u}catch(e){}
render();
</script>
</body></html>
