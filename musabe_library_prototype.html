<title>Musabe Schools Library</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: collapsible green sidebar organised in modules (Library, Students, Access) + compact workspace. School colours: Boys blue, Girls pink, Pre-primary orange. */
:root{
  --bg:#f4f8f5; --surface:#ffffff; --soft:#ebf3ee; --ink:#13241b; --muted:#587064; --line:#d8e5dc; --thumb:rgba(88,112,100,.35);
  --primary:#16794a; --on-primary:#ffffff; --primary-soft:#dff2e7;
  --side:#0c3a29; --side-ink:#bfe0cf; --side-line:rgba(255,255,255,.12);
  --boys:#1f5fbf; --girls:#c2347a; --pre:#d9822b;
  --ok:#16794a; --ok-soft:#dff2e7; --warn:#8a5a00; --warn-soft:#fbecca; --bad:#c0392b; --bad-soft:#fbe1de;
  --shadow:0 1px 2px rgba(12,58,41,.06),0 4px 12px rgba(12,58,41,.04);
  --paper:#ffffff; --rink:#1b3fa8; --rred:#c0392b; --rtext:#0d1530;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'Cascadia Mono',Consolas,'SF Mono',monospace;
  --hand:'Segoe Script','Bradley Hand','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1511; --surface:#111f18; --soft:#172a21; --ink:#e6f2ea; --muted:#93ad9f; --line:#223a2e; --thumb:rgba(147,173,159,.4);
  --primary:#4ec58a; --on-primary:#06241a; --primary-soft:#173a2a; --side:#071410; --side-ink:#a5c8b6;
  --boys:#6aa2ff; --girls:#f27bb4; --pre:#f0a95a;
  --ok:#4ec58a; --ok-soft:#173a2a; --warn:#e3b252; --warn-soft:#3a2d0f; --bad:#f08a80; --bad-soft:#40201c; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1511; --surface:#111f18; --soft:#172a21; --ink:#e6f2ea; --muted:#93ad9f; --line:#223a2e; --thumb:rgba(147,173,159,.4);
  --primary:#4ec58a; --on-primary:#06241a; --primary-soft:#173a2a; --side:#071410; --side-ink:#a5c8b6;
  --boys:#6aa2ff; --girls:#f27bb4; --pre:#f0a95a;
  --ok:#4ec58a; --ok-soft:#173a2a; --warn:#e3b252; --warn-soft:#3a2d0f; --bad:#f08a80; --bad-soft:#40201c; --shadow:none; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4}
h1,h2,h3,p{margin:0} h1{font-size:21px;font-weight:700;letter-spacing:-.01em;text-wrap:balance} h2{font-size:15px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:12.5px} .mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sch{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));white-space:nowrap}
.sc-boys{--c:var(--boys)} .sc-girls{--c:var(--girls)} .sc-pre{--c:var(--pre)}

/* shell + collapsible sidebar (floating card, green accents) */
.app{--w:268px;display:grid;grid-template-columns:var(--w) minmax(0,1fr);min-height:100vh}
.app.min{--w:84px}
@media (prefers-reduced-motion:no-preference){.app{transition:grid-template-columns .2s ease}}
.sw{padding:12px 0 12px 12px;min-width:0}
.side{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:14px 12px;position:sticky;top:12px;height:calc(100vh - 24px);overflow-y:auto;overflow-x:hidden;width:100%;scrollbar-width:none}
.stop{display:flex;align-items:center;gap:10px;padding:0 2px 10px;min-height:56px}
.logoBtn{all:unset;box-sizing:border-box;cursor:pointer;position:relative;width:48px;height:48px;border-radius:14px;flex:none}
.logo,.tg{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center}
.logo img{width:46px;height:46px;object-fit:contain}
.tg{background:var(--primary);color:var(--on-primary);opacity:0}
.logoBtn:hover .logo,.logoBtn:focus-visible .logo{opacity:0} .logoBtn:hover .tg,.logoBtn:focus-visible .tg{opacity:1}
.bt b{display:block;font-size:15px;line-height:1.2;white-space:nowrap} .bt span{font-size:12px;color:var(--muted);white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.grp{display:flex;flex-direction:column;gap:2px}
.modh{padding:14px 12px 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);white-space:nowrap;border-top:1px solid var(--line);margin-top:8px}
.sn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink);font-weight:500;position:relative;white-space:nowrap}
.sn svg{color:var(--primary)}
.sn:hover{background:var(--primary-soft)}
.sn[aria-current="page"]{background:var(--primary);color:var(--on-primary);font-weight:700;box-shadow:0 4px 12px color-mix(in srgb,var(--primary) 35%,transparent)}
.sn[aria-current="page"] svg{color:var(--on-primary)}
.sn:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.sn .lab{flex:1}
.nb{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px}
.setbox{background:var(--soft);border-radius:16px;padding:4px;margin-top:10px}
.setbox .modh{border:0;margin:0;padding:8px 10px 2px}
.setbox .sn{color:var(--ink)}
.sfoot{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ucard{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:14px}
.av{width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;flex:none}
.ucard b{display:block;font-size:13px;line-height:1.2;white-space:nowrap} .ucard span{font-size:12px;color:var(--muted);white-space:nowrap}
.app.min .bt,.app.min .lab,.app.min .ucard>div:last-child{display:none}
.app.min .modh{padding:0;height:1px;margin:8px 8px;background:var(--line);border:0;font-size:0}
.app.min .setbox .modh{display:none}
.app.min .sn{justify-content:center;padding:0;height:44px;width:44px;margin:0 auto}
.app.min .nb{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;font-size:10px;padding:0 3px}
.app.min .ucard{justify-content:center;padding:6px 0;border:0}
.app.min .stop{justify-content:center;padding:0 0 10px}
.bd{display:none}
.col{display:flex;flex-direction:column;min-width:0;overflow-x:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.bar .school{font-weight:600}
.ctx{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);font-weight:600;background:var(--ok-soft);padding:3px 10px;border-radius:999px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
@media (prefers-reduced-motion:no-preference){.live::before{animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.35}}}
.main{padding:16px 20px 32px;display:flex;flex-direction:column;gap:14px;max-width:1280px;width:100%}
@media (max-width:860px){
  .app,.app.min{grid-template-columns:84px minmax(0,1fr)}
  .app.open .side{position:fixed;left:12px;top:12px;width:268px;z-index:40;box-shadow:6px 0 24px rgba(0,0,0,.35)}
  .app.open .bd{display:block;position:fixed;inset:0;background:rgba(5,15,10,.5);z-index:35}
  .bar{padding:8px 12px} .main{padding:12px 12px 28px}
}

/* blocks */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.head p{color:var(--muted);margin-top:2px;max-width:64ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.panel>.ph{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel>.pb{padding:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;display:flex;flex-direction:column;gap:1px;box-shadow:var(--shadow)}
.tile .k{font-size:12.5px;color:var(--muted)} .tile .v{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.tile.alert{border-color:var(--warn)} .tile.alert .v{color:var(--warn)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.tw{overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
.tw::-webkit-scrollbar{height:8px;background:transparent} .tw::-webkit-scrollbar-track{background:transparent}
.tw::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:99px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover{background:var(--soft)}
.empty{padding:18px 14px;color:var(--muted)}

/* forms */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 11px;min-height:38px;width:100%;color:var(--ink)}
input[type=checkbox]{width:17px;height:17px;min-height:0;padding:0}
input[type=file]{padding:6px 10px}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13.5px;font-weight:500}
.btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--primary);padding:0 16px;border-radius:999px;font-weight:700;min-height:38px;white-space:nowrap}
.btn:hover{background:var(--primary-soft)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)} .btn.danger:hover{background:var(--bad-soft)}
.btn.sm{min-height:30px;padding:0 12px;font-size:12.5px}
.btn.big{min-height:46px;font-size:15px;padding:0 24px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.b{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)} .b-info{background:var(--primary-soft);color:var(--primary)}
.b-mute{background:var(--soft);color:var(--muted)}
.notice{border-radius:12px;padding:9px 14px;background:var(--primary-soft);color:var(--primary);font-weight:500}
.notice.warn{background:var(--warn-soft);color:var(--warn)} .notice.bad{background:var(--bad-soft);color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted);min-height:16px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-r{display:grid;grid-template-columns:minmax(90px,170px) 1fr 40px;gap:10px;align-items:center;font-size:13.5px}
.bar-r i{display:block;height:9px;border-radius:99px;background:var(--primary)} .bar-r .t{background:var(--soft);border-radius:99px}
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:9px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;cursor:pointer}
.feed li:hover{background:var(--soft)} .feed li:last-child{border-bottom:0}
.feed time{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.feed .nm{font-weight:600} .feed .sub{font-size:12.5px;color:var(--muted)}
.new{animation:flash 2.5s ease-out}
@keyframes flash{from{background:var(--primary-soft)}to{background:transparent}}
.schools{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.scard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:11px 14px;box-shadow:var(--shadow)}
.scard b{display:block;color:var(--c)}

/* combo (student search) */
.combo{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:20;max-height:300px;overflow-y:auto}
.sug button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:8px 12px;color:var(--ink);font-size:14px}
.sug button:hover,.sug button.on{background:var(--primary-soft)}
.sug mark{background:none;color:var(--primary);font-weight:700}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px 14px}
.lbox{max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.lbox .brandrow{display:flex;align-items:center;gap:12px}
.lbox .lg{width:68px;height:68px}.lbox .lg img{width:100%;height:100%;object-fit:contain}
.proto{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:7px 12px;font-size:12.5px}
.demo{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.demo button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px}
.demo button:hover{background:var(--primary-soft)} .demo button:focus-visible{outline:2px solid var(--primary)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}

/* dialog + toast */
.ov{position:fixed;inset:0;background:rgba(5,15,10,.6);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:50}
.dlg{background:var(--surface);border-radius:18px;max-width:760px;width:100%;padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.dlg.narrow{max-width:460px}
.pw{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.06em;background:var(--soft);border-radius:12px;padding:10px 14px;text-align:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:60;max-width:90vw;font-weight:500}

/* receipt slip: copies the school's printed receipt book */
.slip{page:slip;background:var(--paper);color:var(--rtext);border:2px solid var(--rink);border-radius:6px;padding:14px 18px;font-family:var(--font);position:relative}
.slip .hd{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;text-align:center}
.slip .crest{width:68px;height:68px}.slip .crest img{width:100%;height:100%;object-fit:contain}
.slip h4{margin:0;color:var(--rink);font-size:20px;letter-spacing:.02em;font-weight:800}
.slip .addr{color:var(--rink);font-size:12px;font-weight:600;line-height:1.35}
.slip .ttl{display:inline-block;color:var(--rink);font-weight:800;border-bottom:2px solid var(--rink);margin-top:5px;letter-spacing:.03em}
.slip .meta{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 12px;align-items:end;margin-top:8px;font-size:13px;color:var(--rink);font-weight:700}
.slip .no{font-size:22px;color:var(--rred);font-weight:800;font-family:var(--mono)}
.slip .fill{border-bottom:1px dotted var(--rink);min-height:23px;font-family:var(--hand);font-size:17px;color:#0d2a8a;font-weight:600;padding:0 6px}
.slip table{margin-top:8px;border:2px solid var(--rink);min-width:0}
.slip th{background:none;color:var(--rink);font-size:12px;border:1px solid var(--rink);padding:4px 8px;text-transform:none;letter-spacing:0}
.slip td{border:1px solid var(--rink);padding:3px 8px;font-family:var(--hand);font-size:15px;color:#0d2a8a;height:26px}
.slip td.r,.slip th.r{text-align:right} .slip td.c,.slip th.c{text-align:center}
.slip .ln{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:end;margin-top:6px;color:var(--rink);font-weight:700;font-size:13px}
.slip .foot{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:end;margin-top:8px}
.slip .tsh{display:flex;align-items:center;gap:8px;color:var(--rink);font-weight:800;font-size:17px}
.slip .box{border:3px solid var(--rink);border-radius:8px;min-width:150px;padding:5px 10px;text-align:right;font-family:var(--mono);font-size:19px;color:#0d2a8a;font-weight:700}
.slip .sign{text-align:right;color:var(--rink);font-weight:700;font-size:12px}
.slip .nr{text-align:center;font-style:italic;font-weight:700;color:var(--rink);margin-top:6px;font-size:13px}
.slip .void{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;font-weight:800;color:rgba(192,57,43,.35);transform:rotate(-14deg);pointer-events:none}
@media (max-width:560px){.slip .hd{grid-template-columns:1fr}.slip .crest{margin:0 auto}.slip .meta{grid-template-columns:auto 1fr}.slip h4{font-size:16px}}
@page slip{size:A5 landscape;margin:8mm}
@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;left:0;top:0;width:100%}
  .ov{position:static!important;background:none!important;padding:0!important;overflow:visible!important}
  .dlg{border:0!important;padding:0!important;max-width:none!important}
  body{background:#fff}
  .noprint,.noprint *{display:none!important;visibility:hidden!important}
  .panel{box-shadow:none;border-radius:0}
  .tw{overflow:visible} table{min-width:0}
}
</style>

<div id="app"></div>
<div id="dlgbox"></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Math.round(Number(n)||0).toLocaleString('en-US');
const fmt=n=>'TSh '+num(n);
const dAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
const TODAY=dAgo(0), MONTH=TODAY.slice(0,7);
const fd=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const ft=iso=>new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const monthName=m=>new Date(m+'-01T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
const pad=n=>String(n).padStart(4,'0');
const CATS=['Uniform','Book','Exercise book','Stationery','Other'];
const CAN_SAVE=location.protocol==='file:';

/* ---------- fuzzy student search ---------- */
const STC=new WeakMap();
const toks=s=>{let t=STC.get(s);if(!t){t=s.name.toLowerCase().split(/[\s\-.']+/).filter(Boolean);STC.set(s,t)}return t};
function osa(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=[];for(let i=0;i<=m;i++){d[i]=[i];}for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}
function tokScore(q,t){
  if(t.startsWith(q))return 0; if(q.length>1&&t.includes(q))return 1;
  if(q.length>=3){const k=q.length>=6?2:1;let d=osa(q,t.slice(0,q.length));if(d<=k)return 2+d;d=osa(q,t);if(d<=k)return 2+d}
  return Infinity;
}
function searchStudents(q,pool,limit=8){
  q=q.toLowerCase().trim();if(!q)return[];const qt=q.split(/\s+/),res=[];
  for(const s of pool){const t=toks(s);let tot=0;
    for(const x of qt){let best=Infinity;for(const y of t){const sc=tokScore(x,y);if(sc<best)best=sc;if(!best)break}if(best===Infinity){tot=Infinity;break}tot+=best}
    if(tot!==Infinity)res.push([tot,s])}
  res.sort((a,b)=>a[0]-b[0]||a[1].name.localeCompare(b[1].name));return res.slice(0,limit).map(r=>r[1]);
}
const hl=(name,q)=>{const w=q.trim().split(/\s+/)[0];if(!w)return esc(name);const i=name.toLowerCase().indexOf(w.toLowerCase());return i<0?esc(name):esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+w.length))+'</mark>'+esc(name.slice(i+w.length))};

function w3(n){let s='';if(n>=100){s+=ONES[Math.floor(n/100)]+' hundred';n%=100;if(n)s+=' and '}if(n>=20){s+=TENS[Math.floor(n/10)];if(n%10)s+='-'+ONES[n%10]}else if(n)s+=ONES[n];return s}

  </div>

function stuNow(){return S.draft.stuId?S.students.find(x=>x.id===S.draft.stuId):null}
function syncGender(){
  const sc=mySchool(),stu=stuNow();
  if(sc.gender){S.draft.gender=sc.gender;return}
  const lab=$('#genlab');
  if(stu&&stu.gender){S.draft.gender=stu.gender;if(lab)lab.hidden=true}
  else{if(lab){lab.hidden=false;S.draft.gender=$('#gender').value}else S.draft.gender=''}
}
function updatePriceBox(){
  const el=$('#sell-price');if(!el)return;const id=+val('sell-item');
  if(!id){el.value='';return}
  const it=itemOf(id),g=S.draft.gender||'';
  if(it.gp&&!g){el.value='Choose boy or girl first';return}
  el.value=fmt(priceFor(it,g))+(it.gp?(g==='F'?' (girl price)':' (boy price)'):'');
}

}
function showSug(){

  const h=$('#stuhint');if(h&&!S.draft.stuId)h.textContent=q.trim().length>1&&!S.sug.length?'Not in the student list. Choose the class yourself.':'';

function pickStudent(id){
  const s=S.students.find(x=>x.id===id);if(!s)return;
  S.draft.buyer=s.name;S.draft.stuId=s.id;S.draft.cls=s.cls;syncGender();
  $('#buyer').value=s.name;$('#cls').value=s.cls;const g=$('#gender');if(g&&s.gender)g.value=s.gender;
  $('#sug').hidden=true;$('#buyer').setAttribute('aria-expanded','false');

function repriceCart(){
  const g=S.draft.gender||'';

  updateCart();
}
const cartTotal=()=>S.cart.reduce((a,l)=>a+l.qty*l.price,0);

  if(!items.find(n=>n[0]===S.page))S.page=items[0][0];

const NUMW={ONE:1,TWO:2,THREE:3,FOUR:4,FIVE:5,SIX:6,SEVEN:7};
const ROM={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7};
const toN=x=>NUMW[x]||ROM[x]||+x;
function detectClass(txt){
  const t=String(txt).toUpperCase().replace(/[_:\-.,]/g,' ');let m;
  if((m=t.match(/FORM\s*(ONE|TWO|THREE|FOUR|FIVE|SIX|\d)\b/)))return 'Form '+toN(m[1]);
  if((m=t.match(/\bF\s*(\d)\b/)))return 'Form '+m[1];
  if((m=t.match(/\bPP\s*(\d)\b/)))return 'PP'+m[1];
  if((m=t.match(/PRE\s*PRIMARY\s*(ONE|TWO|THREE|[123])\b|\bPP\s*(\d)\b/)))return 'PP'+toN(m[1]||m[2]);
  if((m=t.match(/\b(?:PRIMARY|STD|STANDARD|CLASS|DARASA|P)\s*(ONE|TWO|THREE|FOUR|FIVE|SIX|SEVEN|VII|VI|IV|V|III|II|I|\d)\b/)))return 'P '+toN(m[1]);
  return null;
}
function detectSchool(txt){const t=String(txt).toUpperCase();if(/GIRL/.test(t))return S.schools.find(s=>s.key==='girls');if(/BOYS/.test(t))return S.schools.find(s=>s.key==='boys');if(/ENGLISH|MEDIUM|PRIMARY|NURSERY/.test(t))return S.schools.find(s=>s.key==='pre');return null}
const clean=v=>String(v??'').replace(/\s+/g,' ').trim();
function normGender(v){const s=clean(v).toUpperCase();if(/^(M|ME|MALE|BOY|KIUME)/.test(s))return 'M';if(/^(F|KE|FEMALE|GIRL|KIKE)/.test(s))return 'F';return ''}
function importSheet(rows,fileName,sheetName,fb){
  const out={src:fileName+(sheetName&&sheetName!==fileName?' › '+sheetName:''),school:null,cls:null,added:0,dup:0,skip:0};
  let title='';for(const r of rows.slice(0,6))title+=' '+r.filter(c=>typeof c==='string').join(' ');
  out.school=detectSchool(title)||detectSchool(sheetName)||fb.school;
  out.cls=detectClass(title)||detectClass(sheetName)||detectClass(fileName)||fb.cls;
  let hi=-1;for(let i=0;i<Math.min(rows.length,14);i++){if(rows[i].some(c=>/FIRST\s*NAME|^\s*(STUDENT'?S?\s*)?NAMES?\s*$|JINA/i.test(String(c)))){hi=i;break}}
  if(hi<0){out.skip=rows.length;return out}
  const h=rows[hi].map(c=>String(c).toUpperCase()),idx=re=>h.findIndex(x=>re.test(x));
  const cReg=idx(/REG|ADMISSION/),cF=idx(/FIRST/),cM=idx(/MID+LE/),cL=idx(/LAST|SURNAME/),cSex=idx(/^\s*(SEX|GENDER|JINSIA)\s*$/);
  let cN=-1;if(cF<0)cN=idx(/NAME|JINA/);
  if(!out.school||!out.cls){out.skip=rows.length-hi-1;return out}
  const sc=out.school;
  if(!sc.classes.includes(out.cls)){sc.classes.push(out.cls);sc.classes.sort((a,b)=>classOrder(a)-classOrder(b))}
  if(!fb.cleared[sc.id]){S.students=S.students.filter(s=>!(s.sample&&s.schoolId===sc.id));fb.cleared[sc.id]=1}
  const seen=new Set(S.students.filter(s=>s.schoolId===sc.id).map(s=>s.reg?'r'+s.reg:'n'+s.name+'|'+s.cls));
  for(const r of rows.slice(hi+1)){
    const name=(cN>=0?[r[cN]]:[r[cF],cM>=0?r[cM]:'',cL>=0?r[cL]:'']).map(clean).filter(Boolean).join(' ').toUpperCase();
    if(!/[A-Z]{2}/.test(name)||/^(TOTAL\b|S\/N|REG NO)/.test(name)){if(r.some(c=>clean(c)))out.skip++;continue}
    const reg=cReg>=0?clean(r[cReg]):'';const key=reg&&/\d/.test(reg)?'r'+reg:'n'+name+'|'+out.cls;
    if(seen.has(key)){out.dup++;continue}seen.add(key);
    let g=cSex>=0?normGender(r[cSex]):'';if(!g&&sc.gender)g=sc.gender;
    S.students.push({id:uid(),schoolId:sc.id,name,cls:out.cls,gender:g,reg:/\d/.test(reg)?reg:'',sample:false});out.added++;
  }
  return out;
}
async function importFiles(files){
  if(!window.XLSX&&[...files].some(f=>/\.xlsx?$/i.test(f.name)))return toast('Cannot read .xlsx offline. Connect to the internet once, or save the sheets as CSV.');
  const fb={school:S.schools.find(s=>s.id===+val('imp-school'))||null,cls:val('imp-cls')||null,cleared:{}};
  const rows=[];
  for(const f of files){
    if(/\.xlsx?$/i.test(f.name)){
      const buf=await f.arrayBuffer(),wb=XLSX.read(buf,{type:'array'});
      wb.SheetNames.forEach(n=>rows.push(importSheet(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}),f.name,n,fb)));
    }else{
      const t=await f.text(),data=t.split(/\r?\n/).map(l=>l.split(/[,;\t]/));
      rows.push(importSheet(data,f.name,f.name,fb));
    }
  }
  const added=rows.reduce((a,r)=>a+r.added,0),dup=rows.reduce((a,r)=>a+r.dup,0),noPlace=rows.filter(r=>!r.school||!r.cls).length;
  S.imp={rows,msg:`Added ${added} students from ${rows.length} sheet${rows.length===1?'':'s'}. ${dup?dup+' were already in the list. ':''}${noPlace?noPlace+' sheet(s) could not be placed in a school and class: choose them in the boxes above and load again.':''}`};
  save();render();toast(`Added ${added} students`);
}

    list.filter(r=>r.status==='ACTIVE').forEach(r=>r.lines.forEach(l=>b.push([RN(r.no),r.date,schoolOfLib(r.libId).name,r.buyer,r.cls,nameOf(l.itemId),l.qty,l.price,l.qty*l.price])));
    saveFile('sales-'+TODAY,{Receipts:a,'Items sold':b});
  },
  'create-lib'(){
    const name=val('l-name').trim(),sid=+val('l-school'),uf=val('l-ufull').trim(),un=val('l-uname').trim().toLowerCase();
    if(!name)return toast('Type the library name');
    if(S.libs.some(l=>l.name.toLowerCase()===name.toLowerCase()))return toast('A library with that name exists');
    if(un&&S.users.some(u=>u.username===un))return toast('That username is already used');
    const lib={id:uid(),name,schoolId:sid};S.libs.push(lib);lg(`Library created: ${name}`);
    if(un){const pw=tempPw(),u={id:uid(),name:uf||un,username:un,pass:pw,must:true,role:'librarian',libId:lib.id,active:true};S.users.push(u);render();tempDlg('Library and librarian created',u,pw)}
    else{render();toast('Library created. Send it stock from “Stock in”.')}
  },
  'save-recno'(){const n=Math.floor(+val('recno'));if(!(n>0))return toast('Enter a number');if(S.receipts.some(r=>+r.no>=n))return toast('That number is already used. Choose a higher one.');S.nextRec=n;toast('Saved')},
  'create-user'(){
    const name=val('u-name').trim(),user=val('u-user').trim().toLowerCase()||userName(val('u-name')),role=val('u-role');
    if(!name)return toast('Type the full name');if(S.users.some(u=>u.username===user))return toast('That username is already used');
    if(!(CREATES[S.user.role]||[]).includes(role))return toast('You cannot register this type of account');
    const pw=tempPw(),u={id:uid(),name,username:user,pass:pw,must:true,role,active:true};if(role==='librarian')u.libId=+val('u-lib');if(role==='bursar')u.schoolId=+val('u-school');
    S.users.push(u);lg(`Account made for ${name}`);render();tempDlg('Account created',u,pw);
  },
  'toggle-user'(el){const u=userOf(+el.dataset.id);if(canManage(u))u.active=!u.active;render()},
  ovclose(el,e){if(e.target===el&&!S.locked)closeDlg()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){f(el,e);save()}});
document.addEventListener('mousedown',e=>{if(e.target.closest('.sug'))e.preventDefault()});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Escape'&&!S.locked)closeDlg();
  if(e.key==='Enter'&&t.matches('tr.click'))t.click();
  if(e.key==='Enter'&&t.id==='cq'){const c=collectRows(t.value);if(c.l.length===1)recDlg(c.l[0])}
  if((t.id==='lu'||t.id==='lp')&&e.key==='Enter')ACT.signin();
  if(t.id==='buyer'&&S.sug.length){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();S.sugI=(S.sugI+(e.key==='ArrowDown'?1:-1)+S.sug.length)%S.sug.length;[...$('#sug').children].forEach((b,i)=>b.classList.toggle('on',i===S.sugI))}
    else if(e.key==='Enter'){e.preventDefault();pickStudent(S.sug[Math.max(0,S.sugI)].id)}
    else if(e.key==='Escape'){$('#sug').hidden=true}
  }
});
function refilter(){const l=recList();$('#rbody').innerHTML=recRows(l)||`<tr><td colspan="7" class="empty">No receipts found.</td></tr>`;$('#rsum').textContent=recSummary(l)}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.draft)S.draft[t.dataset.draft]=t.value;
  if(t.id==='buyer'){if(S.draft.stuId&&$('#gender'))$('#gender').value='';S.draft.stuId=null;syncGender();repriceCart();refreshSellItems();showSug()}
  if(t.id==='q'||t.id==='catf')$('#stbody').innerHTML=stockRows(val('q'),val('catf'));
  if(t.id==='rq')refilter();
  if(t.id==='cq'){const c=collectRows(t.value);$('#cbody').innerHTML=c.html;$('#csum').textContent=t.value.trim()?`${c.l.length} found`:`${c.l.length} waiting for items`}
  if(t.id==='sq'){S.stu.q=t.value;studentRows()}
  if(t.id==='paid')t.dataset.touched='1';
});
document.addEventListener('focusin',e=>{if(e.target.id==='buyer'&&e.target.value.trim())showSug()});
document.addEventListener('focusout',e=>{if(e.target.id==='buyer')setTimeout(()=>{const b=$('#sug');if(b)b.hidden=true},120)});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='scopesel'){const v=t.value;S.scope=v==='all'?{t:'all'}:{t:v[0]==='s'?'school':'lib',id:+v.slice(2)};render();return}
  if(t.id==='rm')refilter();
  if(t.id==='ssch'){S.stu.school=t.value;S.stu.cls='';render();return}
  if(t.id==='sc'){S.stu.cls=t.value;studentRows()}
  if(t.id==='s-school'){$('#s-cls').innerHTML=classesOf(+t.value).map(c=>`<option>${c}</option>`).join('');const g=schoolOf(+t.value).gender;$('#s-gen').value=g||'M';$('#s-gen').disabled=!!g}
  if(t.id==='gender'){S.draft.gender=t.value;repriceCart();refreshSellItems()}
  if(t.id==='sell-item')updatePriceBox();
  if(t.id==='stfile'&&t.files.length){importFiles([...t.files]);t.value='';return}
  if(t.id==='u-role'){$('#u-librow').hidden=t.value!=='librarian';$('#u-schrow').hidden=t.value!=='bursar'}
  if(t.dataset.cart){
    const l=S.cart[+t.dataset.i],k=t.dataset.cart;
    if(k==='qty'){let q=Math.max(1,Math.floor(+t.value)||1);const others=S.cart.reduce((a,x)=>x!==l&&x.itemId===l.itemId?a+x.qty:a,0);
      if(q+others>availLib(l.itemId)){q=Math.max(1,availLib(l.itemId)-others);toast(`Only ${availLib(l.itemId)} available in the library`)}l.qty=q;t.value=q}
    else if(k==='price')l.price=Math.max(0,Math.floor(+t.value)||0);else l.remark=t.value;
    updateTotals();
  }
  if(t.dataset.det){
    const it=itemOf(+t.dataset.id),k=t.dataset.det;
    if(k==='name'){const n=t.value.trim().toUpperCase();if(!n){t.value=it.name;return toast('Name cannot be empty')}it.name=n;t.value=n}
    else if(k==='cat')it.cat=t.value;
    else if(k==='gp'){it.gp=t.checked;if(it.gp){it.priceM=it.price;it.priceF=it.price}else it.price=it.priceM;render()}
    else if(k==='price'||k==='priceM'||k==='priceF'){const p=Math.max(0,Math.floor(+t.value)||0);if(k==='priceM')it.price=p;it[k]=p;t.value=p;lg(`Price of ${it.name} changed`)}
    else it.reorder=Math.max(0,Math.floor(+t.value)||0);
    toast('Saved');
  }
  save();
});
/* live updates from another tab (stands in for the real-time server) */
addEventListener('storage',e=>{
  if(e.key!==KEY||!e.newValue)return;
  const before=new Set(S.receipts.map(r=>r.no));
  load();
  if(S.user){const u=userOf(S.user.id);if(u)S.user=u}
  const added=S.receipts.filter(r=>!before.has(r.no));
  added.forEach(r=>S.fresh[r.no]=1);
  if(S.user&&!isTied()&&added.length){const r=added[0];toast(`New sale: ${r.buyer} · ${fmt(r.total)} · ${schoolOfLib(r.libId)?.short||''}`)}
  if(S.user&&isLib()&&added.some(r=>r.libId===myLib()))toast(`New receipt ${RN(added[0].no)}: items to give`);
  if(S.user&&isLib()&&waitingLines([myLib()])&&S.page==='incoming')toast('New stock was sent to your library');
  const a=document.activeElement;
  if(!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))&&!$('.ov'))render();
  setTimeout(()=>{S.fresh={}},3000);
});
if(!load()){seed();save()}
try{const u=sessionStorage.getItem('musabe-user')||localStorage.getItem('musabe-user');if(u)S.user=userOf(+u)||null}catch(e){}
try{S.side=localStorage.getItem('musabe-side')||(matchMedia('(max-width:860px)').matches?'min':'open')}catch(e){}
render();if(S.user&&S.user.must)passDlg(true);
})();
</script>
