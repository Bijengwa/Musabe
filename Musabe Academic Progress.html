<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Musabe Academic Progress</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: same family as the Musabe Library app. Green sidebar card + workspace. Year runs left to right: Set 1 … Set 8. Bands: critical red → excellent green. */
:root{
  --bg:#f4f8f5; --surface:#ffffff; --soft:#ebf3ee; --ink:#13241b; --muted:#587064; --line:#d8e5dc;
  --primary:#16794a; --on-primary:#ffffff; --primary-soft:#dff2e7;
  --boys:#1f5fbf; --girls:#c2347a; --pre:#d9822b;
  --ok:#16794a; --ok-soft:#dff2e7; --warn:#8a5a00; --warn-soft:#fbecca; --bad:#c0392b; --bad-soft:#fbe1de;
  --b0:#d0402f; --b1:#e2a127; --b2:#a9bfb3; --b3:#5fb185; --b4:#16794a;
  --s1:#1f5fbf; --s2:#c2347a; --s3:#d9822b; --s4:#7a4fc2;
  --necta:#1b3fa8; --book:#8a5a00; --teach:#16794a;
  --shadow:0 1px 2px rgba(12,58,41,.06),0 4px 12px rgba(12,58,41,.04);
  --font:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'Cascadia Mono',Consolas,'SF Mono',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1511; --surface:#111f18; --soft:#172a21; --ink:#e6f2ea; --muted:#93ad9f; --line:#223a2e;
  --primary:#4ec58a; --on-primary:#06241a; --primary-soft:#173a2a;
  --boys:#6aa2ff; --girls:#f27bb4; --pre:#f0a95a;
  --ok:#4ec58a; --ok-soft:#173a2a; --warn:#e3b252; --warn-soft:#3a2d0f; --bad:#f08a80; --bad-soft:#40201c;
  --b0:#e8685b; --b1:#d9a441; --b2:#4f6a5d; --b3:#3c9466; --b4:#4ec58a;
  --s1:#6aa2ff; --s2:#f27bb4; --s3:#f0a95a; --s4:#b192f0;
  --necta:#8fa8ff; --book:#e3b252; --teach:#4ec58a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1511; --surface:#111f18; --soft:#172a21; --ink:#e6f2ea; --muted:#93ad9f; --line:#223a2e;
  --primary:#4ec58a; --on-primary:#06241a; --primary-soft:#173a2a;
  --boys:#6aa2ff; --girls:#f27bb4; --pre:#f0a95a;
  --ok:#4ec58a; --ok-soft:#173a2a; --warn:#e3b252; --warn-soft:#3a2d0f; --bad:#f08a80; --bad-soft:#40201c;
  --b0:#e8685b; --b1:#d9a441; --b2:#4f6a5d; --b3:#3c9466; --b4:#4ec58a;
  --s1:#6aa2ff; --s2:#f27bb4; --s3:#f0a95a; --s4:#b192f0;
  --necta:#8fa8ff; --book:#e3b252; --teach:#4ec58a; --shadow:none; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
h1,h2,h3,p{margin:0} h1{font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance} h2{font-size:15px;font-weight:700;text-wrap:balance} h3{font-size:13px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:12.5px} .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sch{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));white-space:nowrap}
.sc-boys{--c:var(--boys)} .sc-girls{--c:var(--girls)} .sc-pre{--c:var(--pre)}

/* shell */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.sw{padding:12px 0 12px 12px;min-width:0}
.side{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;padding:14px 12px;position:sticky;top:12px;height:calc(100vh - 24px);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.brand img{width:44px;height:44px;object-fit:contain;flex:none}
.brand b{display:block;font-size:15px} .brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.sn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;font-weight:500;white-space:nowrap}
.sn:hover{background:var(--soft)}
.sn[aria-current="page"]{background:var(--primary-soft);color:var(--primary);font-weight:700}
.sn .nb{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.sfoot label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.sfoot select{min-height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 8px}
.col{min-width:0;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.bar .yr{font-weight:700} .bar .ctx{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.find{position:relative}
.find input{min-height:38px;border:1px solid var(--line);border-radius:999px;padding:0 14px 0 36px;background:var(--surface);width:260px;max-width:70vw}
.find svg{position:absolute;left:12px;top:10px;color:var(--muted)}
.sug{position:absolute;z-index:20;top:42px;left:0;right:0;min-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}
.sug button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%;padding:8px 12px}
.sug button:hover,.sug button.on{background:var(--soft)}
.main{padding:6px 20px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sw{padding:10px 16px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .side{position:static;height:auto;border-radius:16px;padding:10px}
  .brand{border:0;margin:0;padding-bottom:6px}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .sfoot{flex-direction:row;flex-wrap:wrap;align-items:end}
  .sfoot label{flex:1;min-width:160px}
  .bar,.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .find input{width:100%;max-width:none}
  .find{flex:1 1 100%}
}

/* building blocks */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{color:var(--muted);margin-top:3px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.ph{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ph p{color:var(--muted);font-size:12.5px;margin-top:2px}
.pb{padding:14px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.grid2,.grid2e{grid-template-columns:minmax(0,1fr)}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font-size:26px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .d{font-size:12.5px;color:var(--muted)}
.tile.click{cursor:pointer} .tile.click:hover{border-color:var(--primary)}
.up{color:var(--ok);font-weight:700} .down{color:var(--bad);font-weight:700} .flat{color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
select,input[type=text],input[type=number],textarea{min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px}
textarea{padding:8px 10px;min-height:70px;resize:vertical}
.btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--primary);padding:0 15px;border-radius:999px;font-weight:700;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px}
.btn.ghost{border-color:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--primary);border-color:var(--primary)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.b0{--c:var(--b0)} .b1{--c:var(--b1)} .b2{--c:var(--b2)} .b3{--c:var(--b3)} .b4{--c:var(--b4)}
.mv{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;white-space:nowrap}
.flag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:7px;background:var(--soft);color:var(--ink);white-space:nowrap}
.flag.bad{background:var(--bad-soft);color:var(--bad)} .flag.warn{background:var(--warn-soft);color:var(--warn)}
.src{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:6px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.src-NECTA{--c:var(--necta)} .src-BOOK{--c:var(--book)} .src-TEACHER{--c:var(--teach)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
td.r,th.r{text-align:right} td.c,th.c{text-align:center}
.empty{padding:22px;text-align:center;color:var(--muted)}
.notice{padding:10px 14px;border-radius:12px;background:var(--primary-soft);color:var(--ink);font-size:13.5px}
.notice.warn{background:var(--warn-soft)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--c);vertical-align:middle;margin-right:5px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
.legend i.sq{width:10px;height:10px;border-radius:3px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
svg.spark{display:block}

/* heatmap */
.hm td,.hm th{padding:6px 8px}
.hm th.t,.hm td.t{position:sticky;left:0;background:var(--surface);z-index:1;min-width:170px;max-width:240px}
.hm td.h{text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600;min-width:46px;border-left:2px solid var(--surface)}
.h0{background:color-mix(in srgb,var(--b0) 32%,var(--surface))} .h1{background:color-mix(in srgb,var(--b1) 32%,var(--surface))}
.h2{background:color-mix(in srgb,var(--b2) 30%,var(--surface))} .h3{background:color-mix(in srgb,var(--b3) 30%,var(--surface))} .h4{background:color-mix(in srgb,var(--b4) 38%,var(--surface))}
.hx{color:var(--muted);font-weight:400!important}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(8,minmax(92px,1fr));gap:8px;overflow-x:auto;padding-bottom:2px}
.ts{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--surface);display:flex;flex-direction:column;gap:3px;min-width:0}
.ts:hover{border-color:var(--primary)}
.ts .n{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.ts b{font-size:13px;line-height:1.25}
.ts .m{font-size:12px;color:var(--muted)}
.ts .pg{height:4px;border-radius:2px;background:var(--soft);overflow:hidden;margin-top:3px}
.ts .pg span{display:block;height:100%;background:var(--primary)}
.ts.cur{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.term{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;padding:0 2px 6px}

/* marks grid */
.mg{border-collapse:separate;border-spacing:0}
.mg th,.mg td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.mg th{padding:6px 4px;text-align:center;font-size:11.5px;position:sticky;top:0;z-index:2}
.mg th.nm,.mg td.nm{position:sticky;left:0;z-index:3;background:var(--surface);text-align:left;padding:6px 10px;min-width:190px;white-space:nowrap}
.mg td.nm{z-index:1;font-size:13px}
.mg input.mk{all:unset;box-sizing:border-box;width:46px;height:34px;text-align:center;font-family:var(--mono);font-size:13.5px;background:var(--surface)}
.mg input.mk:focus{background:var(--primary-soft);outline:2px solid var(--primary);outline-offset:-2px}
.mg input.mk.err{background:var(--bad-soft);color:var(--bad);font-weight:700}
.mg input.mk:disabled{background:var(--soft);color:var(--muted)}
.mg td.tot{padding:0 8px;text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.mg th .tp{display:block;font-weight:400;color:var(--muted);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg th.opt{background:var(--warn-soft)}
.mg tr.ab td{opacity:.55}

/* dialog + toast */
.ov{position:fixed;inset:0;background:rgba(5,20,14,.45);display:grid;place-items:center;padding:16px;z-index:50}
.dlg{background:var(--surface);border-radius:18px;max-width:640px;width:100%;max-height:min(86vh,760px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:10px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100vw - 32px)}
.xlbox{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:12px 14px;border:1px dashed var(--line);border-radius:12px}
.xp td{padding:5px 8px;border:1px solid var(--line)}
.xlbox>div:first-child{flex:1;min-width:220px;max-width:70ch}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 12px;max-height:200px;overflow:auto;padding:4px}
.checks label{display:flex;gap:8px;align-items:center;font-size:13.5px}
.why{display:flex;flex-direction:column;gap:8px}
.why li{margin-left:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.bar2{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:60px}
.bar2 span{display:block;height:100%}
@media (prefers-reduced-motion:no-preference){.panel,.tile{transition:border-color .15s}}
</style>

<div id="app"></div>
<div class="ov" id="ov" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>

function seed(){
  rnd=mulberry32(20261109);
  let reg=1;
  CLASSES.forEach(c=>{
    const used=new Set();
    for(let i=0;i<24;i++){
      const g=c.school==='boys'?'M':c.school==='girls'?'F':(rnd()<.5?'M':'F');
      let name;do{name=`${pick(g==='M'?BOYS:GIRLS)} ${pick([...INIT])}. ${pick(SUR)}`}while(used.has(name));used.add(name);
      const id='s'+(reg);
      D.students.push({id,cls:c.id,name,gender:g,reg:`MS/${c.school==='pre'?'P':'S'}/${String(reg).padStart(4,'0')}`});reg++;
      let th=gauss()*.85, sl=gauss()*.03;
      const r=rnd();
      if(i===0){th=.75;sl=-.24}else if(i===1){th=-1.0;sl=.24}
      else if(r<.17)sl=.12+gauss()*.03;else if(r<.29)sl=-.11-Math.abs(gauss())*.03;
      const so={};c.subjs.forEach(sj=>so[sj]=gauss()*.45);
      LAT[id]={th,sl,so,tp:{}};
    }
    c.subjs.forEach(sj=>{
      const tps=topicsOf(c.lv,sj),td={};tps.forEach(t=>td[t.id]=gauss()*.4);
      const early=tps.slice(0,Math.max(3,Math.ceil(tps.length*.45)));
      const h1=pick(early);let h2=pick(tps.slice(1));while(h2===h1)h2=pick(tps);
      CS[c.id+'|'+sj]={off:gauss()*.22,td,fixed:h1.id,stuck:h2.id};
      td[h1.id]+=1.3;td[h2.id]+=1.15;

  })));

  [['bf2','math',true],['gf4','chem',true],['std7','math',true],['bf4','bio',false],['gf2','eng',true]].forEach(([cid,sj,works],k)=>{
    const st=D.students.filter(s=>s.cls===cid).slice(2).sort((a,b)=>LAT[a.id].th-LAT[b.id].th)[k%3];
    const c=CL[cid],tps=topicsOf(c.lv,sj).slice(0,Math.max(3,Math.ceil(topicsOf(c.lv,sj).length*.4)));
    const t=tps.reduce((w,x)=>stuTopicLat(st.id,x.id)<stuTopicLat(st.id,w.id)?x:w,tps[0]);
    D.interventions.push({id:'iv'+(k+1),stu:st.id,subj:sj,topics:[t.id],plan:PLANS[k],target:55,start:4,followUp:7,by:teacherOf(cid,sj),status:'Active',created:'Jun 2026'});
    if(works)BOOST[st.id+'|'+t.id]=1.2;
  });

  SETS.forEach(S_=>CLASSES.forEach(c=>c.subjs.forEach(sj=>{

}
function stuTopicLat(sid,tid){const L=LAT[sid];if(L.tp[tid]==null)L.tp[tid]=gauss(mulberry32(hash(sid+tid)))*.5;return L.tp[tid]}
const pid=(set,cls,sj)=>`${set}|${cls}|${sj}`;
function buildPaper(set,c,sj,r){
  const L=LV[c.lv],tps=topicsOf(c.lv,sj);
  const taught=c.lv==='f4'?tps.length:Math.max(3,Math.ceil(tps.length*(.2+.8*set/8)));
  const avail=tps.slice(0,taught),recent=avail.slice(-3);
  const nComp=L.choice?7:10,qs=[],used=new Set();
  const take=(t,max)=>{const opts=D.bank.filter(q=>q.topic===t.id&&q.max===max&&!used.has(q.id)&&!q.added);if(!opts.length)return false;const q=pick(opts,r);used.add(q.id);qs.push(q.id);return true};
  if(set>=5)D.interventions.filter(iv=>iv.subj===sj&&D.students.find(s=>s.id===iv.stu).cls===c.id).forEach(iv=>iv.topics.forEach(tid=>take(TOP[tid],10)));
  let guard=0;while(qs.length<nComp&&guard++<80){const t=r()<.5?pick(recent,r):pick(avail,r);take(t,10)}
  qs.sort((a,b)=>TOP[Q(a).topic].ord-TOP[Q(b).topic].ord);
  let choose=null;
  if(L.choice){const st=qs.length;guard=0;while(qs.length<st+3&&guard++<80)take(pick(avail,r),15);choose={from:[st,st+1,st+2],n:2}}
  return {id:pid(set,c.id,sj),set,cls:c.id,subj:sj,qs,choose,marks:{},entered:false};
}
function genMarks(p,r){
  for(let k=0;k<12;k++)r();
  const c=CL[p.cls],cs=CS[p.cls+'|'+p.subj],out={};
  D.students.filter(s=>s.cls===p.cls).forEach(s=>{
    if(r()<.02){out[s.id]='AB';return}
    const L=LAT[s.id],noise=gauss(r)*.25,base=.35+L.th+L.so[p.subj]+L.sl*(p.set-1)+cs.off+noise;
    const exp=p.qs.map(qid=>{const q=Q(qid);let td=cs.td[q.topic];if(q.topic===cs.fixed&&p.set>=5)td-=1.0;
      const b=BOOST[s.id+'|'+q.topic]&&p.set>=5?BOOST[s.id+'|'+q.topic]:0;
      return base+stuTopicLat(s.id,q.topic)-td-q.diff+b});
    const m=exp.map((lg,i)=>{const q=Q(p.qs[i]);return Math.round(clamp(sig(1.15*lg)+gauss(r)*.07,0,1)*q.max)});
    if(p.choose){const ord=p.choose.from.slice().sort((a,b)=>exp[b]+gauss(r)*.4-exp[a]);ord.slice(p.choose.n).forEach(i=>m[i]=null)}
    out[s.id]=m;
  });
  return out;
}

let MEMO=new Map();
const bust=()=>MEMO=new Map();
const memo=(k,f)=>{if(!MEMO.has(k))MEMO.set(k,f());return MEMO.get(k)};
const USER=()=>USERS.find(u=>u.id===S.user);

function pMax(p){if(!p.qs.length)return 0;let t=0;p.qs.forEach((q,i)=>{if(!(p.choose&&p.choose.from.includes(i)))t+=Q(q).max});if(p.choose)t+=p.choose.n*Q(p.qs[p.choose.from[0]]).max;return t}
function stuPct(p,sid){if(!p||!p.entered)return null;const m=p.marks[sid];if(!m||m==='AB')return null;const mx=pMax(p);return mx?m.reduce((a,x)=>a+(x||0),0)/mx*100:null}

function subjsFor(cls){const u=USER();if(u.kind!=='teacher')return CL[cls].subjs;return u.teaches.filter(t=>t.cls===cls).map(t=>t.subj)}

// one student's score in a set: average of the given subjects
// a set only counts once every paper in it has marks, so a half-marked set never looks like a drop
function stuSet(sid,set,subjs){const s=STU(sid);subjs=subjs||subjsFor(s.cls);return memo(`ss|${sid}|${set}|${subjs}`,()=>{const ps=subjs.map(sj=>P(set,s.cls,sj));if(ps.some(p=>!p||!p.entered))return null;return avg(ps.map(p=>stuPct(p,sid)))})}
function series(sid,subjs){return SETS.map(x=>stuSet(sid,x.id,subjs))}
function yearOf(sid,subjs){
  return memo(`yr|${sid}|${subjs}`,()=>{
    const v=series(sid,subjs),idx=v.map((x,i)=>x==null?-1:i).filter(i=>i>=0);
    if(!idx.length)return {v,start:null,now:null,change:null,latest:null,latestSet:null,recent:null};
    const start=avg(idx.slice(0,2).map(i=>v[i])),now=avg(idx.slice(-2).map(i=>v[i]));
    const li=idx[idx.length-1],prev=avg(idx.slice(-3,-1).map(i=>v[i]));

}
const BANDS=['Critical','Needs improvement','Developing','Good','Excellent'];
function band(x){const c=S.cfg;if(x==null)return null;return x<c.critical?0:x<c.target?1:x<c.good?2:x<c.excellent?3:4}
const bandPill=x=>{const b=band(x);return b==null?'<span class="muted">–</span>':`<span class="pill b${b}">${BANDS[b]}</span>`};
function moveOf(ch){if(ch==null)return 'flat';return ch>=S.cfg.move?'up':ch<=-S.cfg.move?'down':'flat'}
const moveTag=ch=>{const m=moveOf(ch);return `<span class="mv ${m}">${m==='up'?'▲ Improving':m==='down'?'▼ Declining':'● Steady'} <span class="num">${signed(ch)}</span></span>`};
// topic score for a set of students in one paper
function topicIn(p,sids){
  const out={};if(!p||!p.entered)return out;
  p.qs.forEach((qid,i)=>{const q=Q(qid);const o=out[q.topic]||(out[q.topic]={got:0,max:0});
    sids.forEach(sid=>{const m=p.marks[sid];if(!m||m==='AB'||m[i]==null)return;o.got+=m[i];o.max+=q.max})});
  return out;
}
function topicGrid(cls,sj,sids){
  return memo(`tg|${cls}|${sj}|${sids?sids.join(','):'all'}`,()=>{
    const ids=sids||studentsOf(cls).map(s=>s.id),g={};
    SETS.forEach(st=>{const t=topicIn(P(st.id,cls,sj),ids);Object.entries(t).forEach(([tid,o])=>{(g[tid]||(g[tid]={}))[st.id]=o.max?o.got/o.max*100:null})});
    return g;
  });
}
function weakTopics(sid,subjs){
  const s=STU(sid);subjs=subjs||subjsFor(s.cls);const out=[];
  subjs.forEach(sj=>{const g=topicGrid(s.cls,sj,[sid]);Object.entries(g).forEach(([tid,row])=>{
    const vals=Object.entries(row).filter(([,v])=>v!=null).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    const lowSets=vals.filter(v=>v<S.cfg.weakTopic).length, last=vals.slice(-2);
    if(lowSets>=2&&avg(last)<S.cfg.weakTopic+5)out.push({tid,subj:sj,score:avg(last),lowSets})})});
  return out.sort((a,b)=>a.score-b.score);
}
function flagsOf(sid,subjs){
  return memo(`fl|${sid}|${subjs}`,()=>{
    const y=yearOf(sid,subjs),f=[],c=S.cfg,s=STU(sid);
    if(y.latest!=null&&y.latest<c.critical)f.push({k:'critical',sev:3,t:`Below ${c.critical}% in ${SET(y.latestSet).name}`});
    else if(y.latest!=null&&y.latest<c.target)f.push({k:'low',sev:2,t:`Below the ${c.target}% target`});
    if(y.recent!=null&&y.recent<=-c.drop)f.push({k:'drop',sev:2,t:`Dropped ${Math.round(-y.recent)} points in the last set`});
    if(y.change!=null&&y.change<=-c.move)f.push({k:'decline',sev:2,t:`Down ${Math.round(-y.change)} points since the start of the year`});
    const w=weakTopics(sid,subjs);if(w.length)f.push({k:'topic',sev:1,t:`Weak in ${w.length} topic${w.length>1?'s':''} across several sets`});
    const missed=SETS.slice(-3).filter(st=>(subjs||subjsFor(s.cls)).some(sj=>{const p=P(st.id,s.cls,sj);return p&&p.entered&&p.marks[sid]==='AB'})).length;

}
const needsSupport=sid=>flagsOf(sid).some(f=>['critical','low','drop','decline'].includes(f.k));
const flagChips=fl=>fl.map(f=>`<span class="flag ${f.sev>=3?'bad':f.sev===2?'warn':''}">${esc(f.t)}</span>`).join(' ');
function classSeries(cls,subjs){return SETS.map(st=>avg(studentsOf(cls).map(s=>stuSet(s.id,st.id,subjs))))}
function rankIn(sid,set){const s=STU(sid),list=studentsOf(s.cls).map(x=>[x.id,stuSet(x.id,set)]).filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]);const i=list.findIndex(x=>x[0]===sid);return i<0?null:{pos:i+1,of:list.length}}
function srcScore(sids,cls,subjs,sets,src){let got=0,max=0;subjs.forEach(sj=>sets.forEach(set=>{const p=P(set,cls,sj);if(!p||!p.entered)return;p.qs.forEach((qid,i)=>{const q=Q(qid);if(src&&q.src!==src)return;sids.forEach(sid=>{const m=p.marks[sid];if(!m||m==='AB'||m[i]==null)return;got+=m[i];max+=q.max})})}));return max?got/max*100:null}
function qStats(p,i){const q=Q(p.qs[i]);let n=0,sum=0,full=0,zero=0,na=0;Object.values(p.marks).forEach(m=>{if(m==='AB')return;if(m[i]==null){na++;return}n++;sum+=m[i];if(m[i]===q.max)full++;if(m[i]===0)zero++});return {n,avg:n?sum/n/q.max*100:null,full,zero,na}}
function qHistory(qid){const out=[];Object.values(D.papers).forEach(p=>{if(!p.entered)return;const i=p.qs.indexOf(qid);if(i<0)return;out.push({p,avg:qStats(p,i).avg})});return out.sort((a,b)=>a.p.set-b.p.set)}

function lineChart({series,h=230,ref=true,labels=SETS.map(s=>'S'+s.id),titles=SETS.map(s=>s.name)}){
  const W=660,H=h,pl=36,pr=14,pt=12,pb=28,iw=W-pl-pr,ih=H-pt-pb,n=labels.length;

  if(ref){s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(S.cfg.critical)}" y2="${y(S.cfg.critical)}" style="stroke:var(--b0)" stroke-dasharray="4 4" stroke-width="1.2" opacity=".8"/><text x="${W-pr}" y="${y(S.cfg.critical)-5}" text-anchor="end" style="fill:var(--b0)">Critical ${S.cfg.critical}%</text>`}

  series.forEach(se=>{

    s+=`<path d="${d}" fill="none" style="stroke:${se.color}" stroke-width="${se.w||2}" ${se.dash?'stroke-dasharray="6 5"':''} stroke-linecap="round" stroke-linejoin="round"/>`;
    const last=se.vals.reduce((a,v,i)=>v!=null?i:a,-1);
    if(!se.noDots)se.vals.forEach((v,i)=>{if(v==null)return;s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===last?4.5:2.6}" style="fill:${i===last?se.color:'var(--surface)'};stroke:${se.color}" stroke-width="2"><title>${esc(se.name)} · ${esc(titles[i])}: ${Math.round(v)}%</title></circle>`});

const legend=series=>`<div class="legend">${series.map(s=>`<span><i class="${s.dash?'dash':''}" style="--c:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
function spark(vals,w=96,h=26){
  const pts=vals.map((v,i)=>[i,v]).filter(p=>p[1]!=null);if(pts.length<2)return '<span class="muted small">–</span>';
  let lo=Math.min(...pts.map(p=>p[1])),hi=Math.max(...pts.map(p=>p[1]));const mid=(lo+hi)/2;if(hi-lo<24){lo=mid-12;hi=mid+12}
  const x=i=>2+i*(w-6)/(vals.length-1),y=v=>h-3-(v-lo)/(hi-lo)*(h-6);
  const d=pts.map((p,k)=>(k?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join(' ');
  const lp=pts[pts.length-1],b=band(lp[1]);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" style="stroke:var(--muted)" stroke-width="1.5"/><circle cx="${x(lp[0])}" cy="${y(lp[1])}" r="3.2" style="fill:var(--b${b})"/></svg>`;
}
function bandColumns(counts){ // counts: per set array of 5
  const W=660,H=200,pl=36,pr=14,pt=10,pb=28,iw=W-pl-pr,ih=H-pt-pb,n=counts.length,bw=iw/n*.62;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Share of students in each band, set by set">`;
  [0,50,100].forEach(v=>{const yy=pt+ih*(1-v/100);s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" style="stroke:var(--line)"/><text x="${pl-6}" y="${yy+4}" text-anchor="end">${v}%</text>`});
  counts.forEach((c,i)=>{const tot=c.reduce((a,b)=>a+b,0),cx=pl+(i+.5)*iw/n;
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle"><title>${esc(SETS[i].name)}</title>S${i+1}</text>`;
    if(!tot)return;let yy=pt+ih;
    c.forEach((k,b)=>{if(!k)return;const hh=k/tot*ih;yy-=hh;s+=`<rect x="${cx-bw/2}" y="${yy}" width="${bw}" height="${Math.max(0,hh-1)}" rx="2" style="fill:var(--b${b})"><title>${esc(SETS[i].name)} · ${BANDS[b]}: ${k} students (${Math.round(k/tot*100)}%)</title></rect>`});

function ivResult(iv){
  const s=STU(iv.stu);const g=topicGrid(s.cls,iv.subj,[s.id]);
  const before=[],after=[];iv.topics.forEach(t=>Object.entries(g[t]||{}).forEach(([set,v])=>{if(v==null)return;(+set<=iv.start?before:after).push([+set,v])}));
  const b=avg(before.sort((a,c)=>a[0]-c[0]).slice(-2).map(x=>x[1])),a=avg(after.map(x=>x[1]));
  return {b,a,diff:a!=null&&b!=null?a-b:null,hit:a!=null&&a>=iv.target};
}
function ivCard(iv){const r=ivResult(iv);return `<div class="panel" style="box-shadow:none"><div class="pb stack" style="gap:6px">
  <div class="row" style="justify-content:space-between"><b>${esc(SUBJ[iv.subj])}: ${iv.topics.map(t=>esc(TOP[t].name)).join(', ')}</b>${r.diff==null?'<span class="flag">Waiting for follow-up</span>':r.diff>=5?`<span class="flag" style="background:var(--ok-soft);color:var(--ok)">Improved ${signed(r.diff)}</span>`:`<span class="flag warn">No clear change (${signed(r.diff)})</span>`}</div>

  const tabs=`<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="${S.paperTab==='q'}" data-act="ptab" data-tab="q">Questions${p.entered?' and analysis':''}</button><button class="tab" role="tab" aria-selected="${S.paperTab==='m'}" data-act="ptab" data-tab="m">${p.entered?'Marks':'Enter marks'}</button></div>`;
  let body='';
  if(S.paperTab==='q'){
    if(!p.qs.length)body=`<div class="pb stack"><div class="notice warn">This paper has no questions yet. Add questions from the bank (NECTA past papers, revision books, or questions other teachers wrote), or write a new one.</div>${ed?`<div class="row"><button class="btn primary" data-act="addq">${icon('plus')}Add from question bank</button><button class="btn" data-act="newq">${icon('edit')}Write a new question</button></div>${qxl(p)}`:''}</div>`;
    else{
      const rows=p.qs.map((qid,i)=>{const q=Q(qid),s=p.entered?qStats(p,i):null,h=qHistory(qid).filter(x=>x.p.id!==p.id),[lb,lc]=qLabel(s?.avg);const opt=p.choose&&p.choose.from.includes(i);

        ${p.entered?`<td class="r num">${pct(s.avg)}</td><td class="r num small">${s.full}</td><td class="r num small">${s.zero}</td><td class="r num small">${opt?s.na:'–'}</td><td>${lc?`<span class="pill ${lc}">${lb}</span>`:''}</td><td class="small muted">${h.length?h.slice(-3).map(x=>`S${x.p.set} ${clsLabel(x.p.cls).replace(' · ',' ')}: ${pct(x.avg)}`).join('<br>')+(h.length>3?`<br>and ${h.length-3} more`:''):'First time used'}</td>`:`${ed?`<td class="r"><button class="btn sm ghost" data-act="rmq" data-i="${i}" aria-label="Remove question ${i+1}">${icon('x')}</button></td>`:'<td></td>'}`}</tr>`});

function readGrid(){
  const p=D.papers[S.arg],st=studentsOf(p.cls),out={},errs=[];
  st.forEach((s,r)=>{
    if($(`[data-ab="${s.id}"]`)?.checked){out[s.id]='AB';return}
    const row=p.qs.map((qid,i)=>{const el=$(`input.mk[data-r="${r}"][data-c="${i}"]`);const t=el.value.trim();const q=Q(qid),opt=p.choose&&p.choose.from.includes(i);el.classList.remove('err');
      if(t===''){if(opt)return null;errs.push([el,'empty']);return undefined}
      if(t==='-')return null;
      const n=Number(t);if(!Number.isFinite(n)||n<0||n>q.max||Math.round(n)!==n){el.classList.add('err');errs.push([el,'bad']);return undefined}
      return n});
    if(p.choose){const att=p.choose.from.filter(i=>row[i]!=null&&row[i]!==undefined).length;if(att>p.choose.n){p.choose.from.forEach(i=>$(`input.mk[data-r="${r}"][data-c="${i}"]`).classList.add('err'));errs.push([null,'choice'])}}
    out[s.id]=row;

// Every sheet the system gives out carries a "Paper code" and the students' Reg no, so the upload always lands on the right paper and the right student.
const IN_FRAME=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const XLNOTE='Downloads are blocked in this online preview. In the copy on your computer (Claude outputs folder) this button downloads a real Excel file. Here is what is inside it:';
function writeBook(name,sheets){ // sheets: [[sheetName, rows, colWidths?]]
  if(!window.XLSX)return toast('Excel needs the internet once to load. Connect and try again.');
  if(IN_FRAME)return previewBook(name,sheets);
  const wb=XLSX.utils.book_new(),used=new Set();
  sheets.forEach(([n,aoa,w])=>{let nm=n.replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31),k=2;while(used.has(nm))nm=n.slice(0,28)+' '+(k++);used.add(nm);
    const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=(w||aoa.reduce((m,r)=>Math.max(m,r.length),0)&&Array.from({length:aoa.reduce((m,r)=>Math.max(m,r.length),0)},(_,i)=>({wch:Math.min(34,Math.max(8,...aoa.slice(0,60).map(r=>String(r[i]??'').length))+2)})));XLSX.utils.book_append_sheet(wb,ws,nm)});
  XLSX.writeFile(wb,name.replace(/[^\w \-().,]+/g,'-').replace(/\s+/g,' ').trim()+'.xlsx');toast('Excel file downloaded');
}

  <div class="tw" style="border:1px solid var(--line);border-radius:10px"><table class="xp"><tbody>${first.slice(0,16).map((r,ri)=>`<tr>${Array.from({length:w},(_,i)=>`<td class="${ri<1?'':'small'}" style="white-space:nowrap;${typeof r[i]==='number'?'text-align:right;font-family:var(--mono)':''}">${esc(r[i]??'')}</td>`).join('')}</tr>`).join('')}${first.length>16?`<tr><td colspan="${w}" class="muted small">… ${first.length-16} more rows</td></tr>`:''}</tbody></table></div>

  <div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="close">Close</button></div>`,true);

async function readBook(file){ // -> [{name, rows}]
  if(/\.csv$/i.test(file.name))return [{name:file.name,rows:(await file.text()).split(/\r?\n/).map(l=>l.split(/[,;\t]/))}];
  if(!window.XLSX)throw new Error('Excel needs the internet once to load. Connect and try again, or save the sheet as CSV.');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  return wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''})}));
}

function parseMarks(rows){
  const code=rows.find(r=>cell(r[0]).toLowerCase()==='paper code');
  const hi=rows.findIndex(r=>cell(r[0]).toLowerCase()==='reg no');if(hi<0)return null;
  const qcols=rows[hi].map((h,i)=>[cell(h).match(/^Q(\d+)/i),i]).filter(x=>x[0]).map(x=>[+x[0][1]-1,x[1]]);
  const abCol=rows[hi].findIndex(h=>/absent/i.test(cell(h)));
  const data=rows.slice(hi+1).filter(r=>cell(r[0])).map(r=>({reg:cell(r[0]),name:cell(r[1]),ab:abCol>=0&&/^ab/i.test(cell(r[abCol])),vals:qcols.map(([qi,ci])=>[qi,cell(r[ci])])}));
  return {code:code?cell(code[1]):null,qcols,data};
}
// check a parsed sheet against a paper without touching the screen
function checkMarks(p,pm){
  const st=studentsOf(p.cls),byReg={},out={},probs=[],unknown=[];st.forEach(s=>byReg[s.reg.toUpperCase()]=s);
  if(pm.qcols.length!==p.qs.length)probs.push(`The sheet has ${pm.qcols.length} questions but the paper has ${p.qs.length}.`);
  pm.data.forEach(r=>{const s=byReg[r.reg.toUpperCase()];if(!s){unknown.push(r.reg);return}
    if(r.ab){out[s.id]='AB';return}
    const row=p.qs.map((_,i)=>p.choose&&p.choose.from.includes(i)?null:undefined);
    r.vals.forEach(([qi,t])=>{if(qi>=p.qs.length)return;const q=Q(p.qs[qi]),opt=p.choose&&p.choose.from.includes(qi);
      if(t===''){if(!opt)probs.push(`${s.name}: Q${qi+1} is empty`);return}
      if(t==='-'){row[qi]=null;return}
      const n=Number(t);if(!Number.isInteger(n)||n<0||n>q.max){probs.push(`${s.name}: Q${qi+1} has "${t}" (allowed 0 to ${q.max})`);return}
      row[qi]=n});
    if(p.choose&&p.choose.from.filter(i=>row[i]!=null).length>p.choose.n)probs.push(`${s.name}: answered more than ${p.choose.n} choice questions`);
    out[s.id]=row});
  const missing=st.filter(s=>!(s.id in out)).map(s=>s.name);
  return {out,probs,missing,unknown};
}

function fillGridFrom(rows,fileName){

  if(pm.qcols.length!==p.qs.length)warn.push(`The file has ${pm.qcols.length} questions but this paper has ${p.qs.length}.`);
  const st=studentsOf(p.cls);let filled=0;const unknown=[];
  pm.data.forEach(r=>{const ri=st.findIndex(s=>s.reg.toUpperCase()===r.reg.toUpperCase());if(ri<0){unknown.push(r.reg);return}

  gridTotals();readGrid(); // marks wrong cells in red

  toast(bad?`Loaded ${filled} students. ${bad} marks are wrong, shown in red.`:`Loaded ${filled} students. Check, then Save marks.`);
}

function takeSetBook(book,fileName){
  const res=[];
  book.forEach(({name,rows})=>{const pm=parseMarks(rows);if(!pm){if(!/how to fill/i.test(name))res.push({sheet:name,ok:false,msg:'Not a marks sheet (no "Reg no" heading). Skipped.'});return}
    const p=D.papers[pm.code];
    if(!p){res.push({sheet:name,ok:false,msg:'No paper code. Use the file downloaded from the system.'});return}
    if(!canEdit(p)){res.push({sheet:name,p,ok:false,msg:'You cannot enter marks for this paper.'});return}
    const filledAny=pm.data.some(r=>r.ab||r.vals.some(([,t])=>t!==''));
    if(!filledAny){res.push({sheet:name,p,ok:false,skip:true,msg:'Empty. Nothing saved.'});return}
    const c=checkMarks(p,pm);
    if(c.probs.length||c.missing.length||c.unknown.length){res.push({sheet:name,p,ok:false,msg:[...c.probs.slice(0,3),c.probs.length>3?`and ${c.probs.length-3} more problems`:'',c.missing.length?`${c.missing.length} students missing`:'',c.unknown.length?`Unknown Reg no: ${c.unknown.slice(0,3).join(', ')}`:''].filter(Boolean).join(' · ')});return}
    if(p.entered&&JSON.stringify(c.out)===JSON.stringify(p.marks)){res.push({sheet:name,p,ok:false,skip:true,msg:'Same as the marks already saved. No change.'});return}
    const was=p.entered;p.marks=c.out;p.entered=true;savePaper(p);res.push({sheet:name,p,ok:true,fix:was,msg:`Saved ${Object.keys(c.out).length} students. Class average ${pct(avg(studentsOf(p.cls).map(s=>stuPct(p,s.id))))}.`});
  });
  render();
  const ok=res.filter(r=>r.ok).length,bad=res.filter(r=>!r.ok&&!r.skip).length;
  openDlg(`<h2>Upload results</h2><p class="muted small">${esc(fileName)} · ${ok} paper${ok===1?'':'s'} saved${bad?` · ${bad} need fixing`:''}. A paper with any problem is not saved, so nothing wrong reaches the reports.</p>
  <div class="tw"><table><thead><tr><th>Sheet</th><th>Paper</th><th>Result</th></tr></thead><tbody>${res.map(r=>`<tr><td class="small">${esc(r.sheet)}</td><td class="small">${r.p?esc(clsLabel(r.p.cls)+' · '+SUBJ[r.p.subj]):'–'}</td><td><span class="flag ${r.ok?'':r.skip?'':'bad'}" ${r.ok?'style="background:var(--ok-soft);color:var(--ok)"':''}>${r.ok?(r.fix?'Corrected':'Saved'):r.skip?'Skipped':'Not saved'}</span><div class="small muted" style="margin-top:3px">${esc(r.msg)}</div>${!r.ok&&r.p&&!r.skip?`<button class="btn sm ghost" data-act="paperm" data-id="${r.p.id}">Open this paper</button>`:''}</td></tr>`).join('')}</tbody></table></div>
  <div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="close">Done</button></div>`,true);
}

const norm=s=>cell(s).toLowerCase().replace(/[^a-z0-9]/g,'');
function takeQuestions(rows,fileName){
  const p=D.papers[S.arg],c=CL[p.cls],tps=topicsOf(c.lv,p.subj),errs=[],items=[];
  const code=rows.find(r=>cell(r[0]).toLowerCase()==='paper code');if(code&&cell(code[1])!==p.id)errs.push(`This file is for another paper (${cell(code[1])}).`);
  const hi=rows.findIndex(r=>cell(r[0]).toLowerCase()==='no');if(hi<0)return toast('Could not find the "No" heading. Use the questions sheet from this page.');
  rows.slice(hi+1).forEach((r,k)=>{const tname=cell(r[1]);if(!tname&&!cell(r[2]))return;const line=hi+2+k;
    const t=tps.find(x=>norm(x.name)===norm(tname))||tps.find(x=>norm(tname).length>3&&(norm(x.name).startsWith(norm(tname))||norm(tname).startsWith(norm(x.name))));
    if(!t){errs.push(`Row ${line}: topic "${tname||'(empty)'}" is not in the ${SUBJ[p.subj]} topic list.`);return}
    const max=Number(cell(r[2]));if(!Number.isInteger(max)||max<1||max>30){errs.push(`Row ${line}: marks must be a whole number from 1 to 30.`);return}
    const s=cell(r[3]),src=/necta/i.test(s)?'NECTA':/book/i.test(s)?'BOOK':'TEACHER';
    items.push({t,max,src,ref:cell(r[4]),choice:/^(y|yes|ndiyo)/i.test(cell(r[5])),text:cell(r[6])})});
  if(!items.length)errs.push('No questions found in the file.');
  const ch=items.map((x,i)=>x.choice?i:-1).filter(i=>i>=0);
  if(ch.length&&(ch.length!==3||ch[0]!==items.length-3||new Set(ch.map(i=>items[i].max)).size>1))errs.push('Choice must be "yes" on exactly the last 3 questions, and they must have the same marks.');
  if(errs.length)return openDlg(`<h2>Questions not added</h2><p class="muted small">${esc(fileName)}. Fix these rows in Excel and upload again. Nothing was changed.</p><ul class="why" style="margin:0">${errs.slice(0,12).map(e=>`<li class="small">${esc(e)}</li>`).join('')}</ul>${errs.length>12?`<p class="small muted">and ${errs.length-12} more</p>`:''}<div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="close">OK</button></div>`);
  let reused=0,added=0;
  p.qs=items.map(x=>{const ex=x.ref&&D.bank.find(q=>q.topic===x.t.id&&q.max===x.max&&q.src===x.src&&norm(q.ref)===norm(x.ref));if(ex){reused++;return ex.id}
    const q={id:'u'+Date.now().toString(36)+Math.floor(Math.random()*1e4),lv:c.lv,subj:p.subj,topic:x.t.id,max:x.max,src:x.src,diff:0,added:true,text:x.text,ref:x.ref||(x.src==='TEACHER'?'Written by '+USER().name:x.src==='NECTA'?LV[c.lv].exam+' past paper':'Revision book')};
    if(x.src==='TEACHER')q.by=USER().name;addBank(q);added++;return q.id});
  p.choose=ch.length?{from:ch,n:2}:null;savePaper(p);S.paperTab='q';render();
  toast(`${items.length} questions set. ${reused} found in the bank, ${added} new ones saved to the bank.`);
}

  addq:()=>{S.pick=null;bankPicker()},
  pickq:el=>{const p=D.papers[S.arg],q=Q(el.dataset.id);
    if(p.choose){const opt=p.qs.splice(p.choose.from[0]);p.qs.push(q.id,...opt);p.choose={from:[p.qs.length-3,p.qs.length-2,p.qs.length-1],n:2}}else p.qs.push(q.id);
    savePaper(p);bankPicker();toast('Question added')},
  rmq:el=>{const p=D.papers[S.arg];p.qs.splice(+el.dataset.i,1);if(p.choose&&p.qs.length<3)p.choose=null;else if(p.choose)p.choose={from:[p.qs.length-3,p.qs.length-2,p.qs.length-1],n:2};savePaper(p);render()},
  newq:()=>newQuestionDlg(true),
  newbank:()=>newQuestionDlg(false),
  saveq:el=>{const max=Math.floor(+val('nqMax'));if(!(max>0&&max<=30))return toast('Marks must be between 1 and 30');
    const src=val('nqSrc'),u=USER();const q={id:'u'+Date.now().toString(36),lv:el.dataset.lv,subj:el.dataset.subj,topic:val('nqTopic'),max,src,diff:0,added:true,text:val('nqText').trim()};
    q.ref=val('nqRef').trim()||(src==='TEACHER'?'Written by '+u.name:src==='NECTA'?LV[q.lv].exam+' past paper':'Revision book');
    if(src==='TEACHER')q.by=u.name;addBank(q);
    if(el.dataset.p==='1'){const p=D.papers[S.arg];if(p.choose){const opt=p.qs.splice(p.choose.from[0]);p.qs.push(q.id,...opt);p.choose={from:[p.qs.length-3,p.qs.length-2,p.qs.length-1],n:2}}else p.qs.push(q.id);savePaper(p)}
    closeDlg();render();toast('Question saved in the bank')},
  savemarks:()=>{const p=D.papers[S.arg];const {out,errs}=readGrid();
    if(errs.length){const e=errs.find(x=>x[0]);if(e){e[0].classList.add('err');e[0].focus()}
      const empty=errs.filter(x=>x[1]==='empty').length,bad=errs.filter(x=>x[1]==='bad').length,ch=errs.filter(x=>x[1]==='choice').length;
      $('#gridmsg').textContent=[empty&&`${empty} empty cells (type 0 or -)`,bad&&`${bad} marks above the question maximum or not a number`,ch&&`${ch} students answered more than ${p.choose?.n} choice questions`].filter(Boolean).join(' · ');return}
    p.marks=out;p.entered=true;S.editMarks=false;savePaper(p);S.paperTab='q';render();toast('Marks saved. Reports and student progress are updated.')},
  xldown:()=>xlDown(D.papers[S.arg]),
  xlsample:()=>{const p=D.papers[S.arg];fillGridFrom(sampleMarksRows(p),'sample marks sheet.xlsx')},
  xlsetdown:()=>xlSetDown(S.setId),
  xlsetsample:()=>{const b=sampleSetBook(S.setId);if(!b)return toast('No waiting papers in this set.');takeSetBook(b,'sample marks file.xlsx')},
  xlqdown:()=>xlQDown(D.papers[S.arg]),
  xlqsample:()=>takeQuestions(sampleQRows(D.papers[S.arg]),'sample questions sheet.xlsx'),
  xlclass:()=>xlClass(),
  xlwatch:()=>xlWatch(S.watchList||[],{support:'need support',down:'declining',up:'improving',all:'all'}[S.watchTab]),
  paperm:el=>{closeDlg();S.paperTab='m';go('paper',el.dataset.id)},
  fillsample:()=>{const p=D.papers[S.arg];const m=genMarks(p,mulberry32(hash(p.id+'demo')));studentsOf(p.cls).forEach((s,r)=>{const v=m[s.id];const ab=$(`[data-ab="${s.id}"]`);ab.checked=v==='AB';
    p.qs.forEach((_,i)=>{const el=$(`input.mk[data-r="${r}"][data-c="${i}"]`);el.disabled=v==='AB';el.value=v==='AB'?'':v[i]==null?'-':v[i];el.classList.remove('err')})});gridTotals();toast('Sample marks filled. Check them, then Save marks.')},
  newplan:el=>planDlg(el.dataset.id),
  saveplan:el=>{const topics=$$('input[name="pt"]:checked').map(x=>x.value);if(!topics.length)return toast('Tick at least one topic');
    const plan=val('plPlan').trim();if(!plan)return toast('Write what will be done');
    D.interventions.unshift({id:'iv'+Date.now().toString(36),stu:el.dataset.id,subj:val('plSubj'),topics,plan,target:+val('plTarget')||S.cfg.target,start:+val('plStart'),by:USER().name,status:'Active',created:'Nov 2026'});
    SAVED.interventions=D.interventions;persist();closeDlg();render();toast('Support plan saved. The next sets will show if it works.')},
  savecfg:()=>{const c={};for(const k of Object.keys(S.cfg)){const v=+val('cfg-'+k);if(!Number.isFinite(v)||v<0||v>100)return toast('Use numbers from 0 to 100');c[k]=v}
    if(!(c.critical<c.target&&c.target<c.good&&c.good<c.excellent))return toast('Bands must go up: critical < target < good < excellent');
    Object.assign(S.cfg,c);SAVED.cfg=S.cfg;persist();bust();render();toast('Settings saved. Every list is recalculated.')},
  reset:()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()},
  bankmore:()=>{S.bankN+=60;render()},
  scopeTo:el=>{S.scope=el.dataset.v;bust();render()},
  pickstu:el=>{$('#sug').hidden=true;$('#find').value='';S.prev={page:S.page,arg:S.arg};S.stuSubj=null;go('student',el.dataset.id)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act]){ACT[el.dataset.act](el,e);return}if(e.target.id==='ov'){closeDlg();if(S.page==='paper')render()}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='scope'){S.scope=t.value;bust();render()}
  else if(t.id==='userSel'){S.user=t.value;S.scope='all';persist();bust();go(S.page==='settings'&&!isAdmin()?'home':['paper','student'].includes(S.page)?'home':S.page)}
  else if(t.id==='clsSel'){S.clsId=t.value;render()}
  else if(t.id==='clsSubj'){S.clsSubj=t.value;render()}
  else if(t.id==='bLv'){S.bankF.lv=t.value;S.bankF.topic='';S.bankN=60;render()}
  else if(t.id==='bSubj'){S.bankF.subj=t.value;S.bankF.topic='';S.bankN=60;render()}
  else if(t.id==='bTopic'){S.bankF.topic=t.value;render()}
  else if(t.id==='bSrc'){S.bankF.src=t.value;render()}
  else if(t.id==='pkTopic'){S.pick.topic=t.value;bankPicker()}
  else if(t.id==='pkSrc'){S.pick.src=t.value;bankPicker()}
  else if(t.id==='choose'){const p=D.papers[S.arg];if(t.checked){if(p.qs.length<4){t.checked=false;return toast('Add at least 4 questions first')}const L=p.qs.slice(-3).map(q=>Q(q).max);if(new Set(L).size>1){t.checked=false;return toast('The last 3 questions must have the same marks')}p.choose={from:[p.qs.length-3,p.qs.length-2,p.qs.length-1],n:2}}else p.choose=null;savePaper(p);render()}
  else if(t.id==='xlup'){if(t.files[0])xlUp(t.files[0]);t.value=''}
  else if(t.id==='xlsetup'){if(t.files[0])xlSetUp(t.files[0]);t.value=''}
  else if(t.id==='xlqup'){if(t.files[0])xlQUp(t.files[0]);t.value=''}
  else if(t.dataset.ab){const r=t.closest('tr');r.classList.toggle('ab',t.checked);r.querySelectorAll('input.mk').forEach(x=>x.disabled=t.checked);gridTotals()}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.classList.contains('mk')){t.classList.remove('err');gridTotals()}
  if(t.id==='find'){const q=t.value.trim().toLowerCase();const box=$('#sug');
    if(!q){box.hidden=true;return}
    const cs=myClasses();
    S.sug=D.students.filter(s=>cs.includes(s.cls)&&q.split(/\s+/).every(w=>s.name.toLowerCase().includes(w))).slice(0,8);S.sugI=-1;
    box.innerHTML=S.sug.map(s=>`<button data-act="pickstu" data-id="${s.id}"><span>${esc(s.name)}</span><span class="muted small">${esc(clsLabel(s.cls))}</span></button>`).join('')||'<div class="empty">No student found</div>';box.hidden=false}
});
document.addEventListener('keydown',e=>{const t=e.target;
  if(e.key==='Escape'&&!$('#ov').hidden){closeDlg();if(S.page==='paper')render()}
  if(t.id==='find'&&S.sug.length){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();S.sugI=(S.sugI+(e.key==='ArrowDown'?1:-1)+S.sug.length)%S.sug.length;$$('#sug button').forEach((b,i)=>b.classList.toggle('on',i===S.sugI))}
    else if(e.key==='Enter'){e.preventDefault();ACT.pickstu({dataset:{id:S.sug[Math.max(0,S.sugI)].id}})}}
  if(t.classList.contains('mk')){const r=+t.dataset.r,c=+t.dataset.c;let nr=r,nc=c;
    if(e.key==='Enter'||e.key==='ArrowDown')nr=r+1;else if(e.key==='ArrowUp')nr=r-1;else if(e.key==='ArrowRight'&&t.selectionStart===t.value.length)nc=c+1;else if(e.key==='ArrowLeft'&&t.selectionStart===0)nc=c-1;else return;
    const n=$(`input.mk[data-r="${nr}"][data-c="${nc}"]`);if(n){e.preventDefault();n.focus();n.select()}}
});
document.addEventListener('focusout',e=>{if(e.target.id==='find')setTimeout(()=>{const b=$('#sug');if(b)b.hidden=true},150)});
document.addEventListener('paste',e=>{const t=e.target;if(!t.classList||!t.classList.contains('mk'))return;
  const txt=(e.clipboardData||window.clipboardData).getData('text');if(!/[\t\n]/.test(txt))return;e.preventDefault();
  const rows=txt.replace(/\r/g,'').split('\n').filter(l=>l.length);const r0=+t.dataset.r,c0=+t.dataset.c;let n=0;
  rows.forEach((line,dr)=>line.split('\t').forEach((v,dc)=>{const el=$(`input.mk[data-r="${r0+dr}"][data-c="${c0+dc}"]`);if(el&&!el.disabled){el.value=v.trim();n++}}));
  gridTotals();toast(`Pasted ${n} marks`)});

boot();render();
})();
</script>

</body></html>
