<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/musabe-logo.png" />
    <link rel="apple-touch-icon" href="/musabe-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c3a29" />
    <title>Musabe Schools System</title>
    <script>
      // Paint the saved look (Light / Dark / System, text size) before the app loads. Same rules as src/prefs.js.
      (function () {
        var p = {}; try { p = JSON.parse(localStorage.getItem('musabe-prefs')) || {}; } catch (e) {}
        var t = p.theme || 'system';
        var d = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
        document.documentElement.setAttribute('data-text', p.textSize || 'normal');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
