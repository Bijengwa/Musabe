<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musabe Schools Management</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AB%3C/text%3E%3C/svg%3E" />
</head>
<body>

  <!-- ══════════ LOGIN ══════════ -->
  <div id="login-view" class="login-wrap hidden">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">M</div>
        <h1>Musabe Schools</h1>
        <p>Management System</p>
      </div>
      <form id="login-form" autocomplete="off">
        <label class="field">
          <span>Email</span>
          <input type="email" id="login-email" placeholder="you@musabe.ac.ug" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </label>
        <div id="login-error" class="login-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign in</button>
      </form>
      <div class="demo-box">
        <p class="demo-title">Demo accounts — click to fill</p>
        <div class="demo-chips">
          <button class="chip" data-email="admin@musabe.ac.ug" data-password="admin12345">Admin</button>
          <button class="chip" data-email="manager@musabe.ac.ug" data-password="musabe12345">Manager</button>
          <button class="chip" data-email="bursar@musabe.ac.ug" data-password="musabe12345">Bursar</button>
          <button class="chip" data-email="storekeeper@musabe.ac.ug" data-password="musabe12345">Storekeeper</button>
          <button class="chip" data-email="head.nursery-primary@musabe.ac.ug" data-password="musabe12345">Head Master</button>
          <button class="chip" data-email="academic.nursery-primary@musabe.ac.ug" data-password="musabe12345">Academic</button>
          <button class="chip" data-email="librarian.nursery-primary@musabe.ac.ug" data-password="musabe12345">Librarian</button>
          <button class="chip" data-email="staff.nursery-primary@musabe.ac.ug" data-password="musabe12345">Staff</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════ APP SHELL ══════════ -->
  <div id="app-view" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-logo">M</div>
        <div>
          <strong>Musabe</strong>
          <span>Schools Management</span>
        </div>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost btn-block" id="logout-btn">Sign out</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <h2 id="page-title">Dashboard</h2>
        <div class="topbar-user">
          <div class="user-meta">
            <span id="user-name">…</span>
            <span id="user-roles" class="role-badges"></span>
          </div>
          <div id="user-avatar" class="avatar">?</div>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
